name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web dosyalarını assets içine kopyala
        run: |
          mkdir -p app/src/main/assets app/src/main/res/mipmap-xxxhdpi
          cp index.html manifest.json logo.png icon-192.png icon-512.png apple-touch-icon.png app/src/main/assets/
          cp icon-192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          sed -i "s/__BUILD__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" app/src/main/assets/index.html

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
