<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Sohbet Odası</title>

<style>
:root{--bg:#0b141a;--pn:#202c33;--in:#202c33;--out:#005c4b;--otx:#e9edef;--tx:#e9edef;--sb:#8696a0;--ac:#00a884;--ip:#2a3942;--bd:#ffffff14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.6}
input,textarea,select{font:inherit}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;pointer-events:none}
header{background:var(--pn);padding:8px 8px 8px 4px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;box-shadow:0 1px 0 var(--bd);z-index:2}
header .info{flex:1;min-width:0}
header b{display:block;font-size:19px}
header small{color:var(--sb);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:active{background:var(--bd)}
#msgs{flex:1;overflow-y:auto;padding:8px 10px 12px;display:flex;flex-direction:column;background:var(--bg);overscroll-behavior:contain}
.day{align-self:center;background:var(--pn);color:var(--sb);font-size:12px;padding:4px 12px;border-radius:10px;margin:12px 0 4px}
.row{display:flex;gap:6px;align-items:flex-end;margin-top:var(--gap,2px)}
.row.first{margin-top:10px}
.row.me{justify-content:flex-end}
.a{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;font-size:14px}
.a img{width:100%;height:100%;object-fit:cover;display:block}
.a.sp{visibility:hidden}
.m{max-width:78%;padding:7px 10px 5px;background:var(--in);box-shadow:0 1px 1px #0002;overflow-wrap:anywhere;line-height:1.35;font-size:var(--fs,16px);border-radius:var(--br,16px)}
.row.ot.first .m{border-top-left-radius:4px}
.row.me.first .m{border-top-right-radius:4px}
.row.me .m{background:var(--out);color:var(--otx)}
.m a{color:var(--ac)}
.n{font-size:12.5px;font-weight:600;margin-bottom:2px}
.m img.p,.m video{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:3px 0}
.t{font-size:10.5px;color:var(--sb);text-align:right;margin-top:2px}
.row.me .t{color:inherit;opacity:.65}
.nt .t{display:none}
#up{display:none;background:var(--pn);color:var(--ac);text-align:center;font-size:13px;padding:6px}
footer{display:flex;gap:8px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--pn);align-items:center}
#t{flex:1;min-width:0;padding:11px 16px;border-radius:24px;border:0;background:var(--ip);color:var(--tx);font-size:16px;outline:0}
#t::placeholder{color:var(--sb)}
#s{background:var(--ac);color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.clip{color:var(--sb);width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
#v{display:none;position:fixed;inset:0;background:#000e;z-index:40;align-items:center;justify-content:center;flex-direction:column;color:#fff}
#v img.big,#v video{max-width:100%;max-height:100%}
#x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:18px;color:#fff;z-index:2;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.pc{text-align:center}.pc .a{width:160px;height:160px;font-size:64px;margin:0 auto 14px}
/* menü */
#mback{display:none;position:fixed;inset:0;z-index:49}
#menu{display:none;position:fixed;top:calc(52px + env(safe-area-inset-top));left:8px;background:var(--pn);border-radius:14px;box-shadow:0 8px 28px #0009;z-index:50;min-width:250px;overflow:hidden}
#menu .mh{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--bd)}
#menu .mh .a{width:44px;height:44px;font-size:18px}
#menu .mh b{display:block;font-size:16px}
#menu button.mi{display:flex;align-items:center;gap:16px;width:100%;padding:14px 16px;font-size:16px;text-align:left}
#menu button.mi:active{background:var(--bd)}
#menu button.mi .i{color:var(--sb)}
/* giriş */
#auth{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto}
#auth .logo{width:84px;height:84px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px}
#auth .logo .i{width:42px;height:42px}
#auth h1{margin:0 0 20px;font-size:24px}
.aw{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.aw .btn{margin:0;width:100%}
.ph{display:flex;gap:8px}
.ph select,.ph input,#ot{background:var(--ip);color:var(--tx);border:0;border-radius:12px;padding:14px 12px;font-size:17px;outline:0}
.ph input{flex:1;min-width:0}
#ot{text-align:center;letter-spacing:10px;font-size:24px;width:100%}
.aerr{color:#f87171;font-size:14px;text-align:center;min-height:18px}
.lk{color:var(--ac);text-align:center;padding:8px;font-weight:600}
#cperm{display:none;position:fixed;inset:0;background:#000a;z-index:90;align-items:center;justify-content:center;padding:20px}
#cperm .box{background:var(--pn);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center}
#cperm .logo2{width:64px;height:64px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
#cperm .logo2 .i{width:32px;height:32px}
#cperm p{color:var(--sb);font-size:14px;line-height:1.5;margin:8px 0 4px}
#cperm .btn{margin:10px 0 0;width:100%}
/* arama */
#call{display:none;position:fixed;inset:0;background:#0d0d0d;z-index:20;flex-direction:column;color:#fff}
#grid{flex:1;display:grid;gap:4px;padding:4px;padding-top:calc(4px + env(safe-area-inset-top));position:relative;min-height:0}
#grid.g1,#grid.g2{grid-template-columns:1fr}
#grid.gN{grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.tile{position:relative;background:#222;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile video.mir{transform:scaleX(-1)}
.tile .a{width:84px;height:84px;font-size:34px}
.tile .nm{position:absolute;left:8px;bottom:8px;font-size:13px;background:#0009;padding:2px 9px;border-radius:10px;z-index:2}
#grid.g2 .tile.loc{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));width:100px;height:140px;z-index:3;box-shadow:0 2px 10px #000a}
#grid.g2 .tile.loc .a{width:48px;height:48px;font-size:20px}
#grid.g2 .tile.loc .nm{display:none}
#ctl{display:flex;justify-content:center;gap:16px;padding:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#ctl button{width:58px;height:58px;border-radius:50%;background:#ffffff26;display:flex;align-items:center;justify-content:center;color:#fff}
#ctl button.off{background:#fff;color:#000}
#ctl button.red{background:#e53935;color:#fff}
#ctl button.red .i{transform:rotate(135deg)}
#ring{display:none;position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));background:var(--pn);color:var(--tx);z-index:35;border-radius:16px;padding:12px;box-shadow:0 6px 24px #0008;align-items:center;gap:10px}
#ring span{flex:1;font-size:15px;display:flex;align-items:center;gap:8px}
#ring button{padding:10px 16px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600}
#ring button.no{background:var(--ip);color:var(--tx);padding:10px 12px;display:flex}
/* durum */
#stp{display:none;position:fixed;inset:0;background:var(--bg);z-index:25;flex-direction:column}
#stp header{padding-left:4px}
#stl{flex:1;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sh{font-size:13px;color:var(--sb);padding:14px 16px 6px;font-weight:600}
.sti{display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer}
.sti:active{background:var(--bd)}
.sti .a{width:50px;height:50px;font-size:20px}
.sti .nfo{flex:1;min-width:0}
.sti .nfo b{display:block;font-size:16px;font-weight:500}
.sti .nfo small{color:var(--sb);font-size:13px}
.inv{padding:8px 14px;border-radius:16px;background:var(--ac);color:#fff;font-weight:600;font-size:14px;flex-shrink:0}
.rg{padding:3px;border-radius:50%;border:3px solid var(--ac);flex-shrink:0}
.rg.seen{border-color:var(--sb)}
.rg.none{border-color:transparent;position:relative}
.plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.plus .i{width:14px;height:14px;stroke-width:3}
.empty{color:var(--sb);text-align:center;padding:30px 24px;font-size:14px;line-height:1.5}
#stfab{position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0008}
#ssheet{display:none;position:fixed;inset:0;background:#0008;z-index:48;align-items:flex-end}
#ssheet .box{background:var(--pn);width:100%;border-radius:18px 18px 0 0;padding:10px 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#ssheet button,#ssheet label{display:flex;align-items:center;gap:16px;width:100%;padding:16px 22px;font-size:16px;text-align:left;cursor:pointer}
#ssheet button:active{background:var(--bd)}
#stv{display:none;position:fixed;inset:0;background:#000;z-index:45;flex-direction:column;color:#fff}
.pbs{display:flex;gap:4px;padding:8px 10px 0;padding-top:calc(8px + env(safe-area-inset-top));z-index:3}
.pb{flex:1;height:3px;background:#ffffff55;border-radius:2px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#fff}
.pb.done i,.pb.curv i{width:100%}
.pb.cur i{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.svh{display:flex;align-items:center;gap:10px;padding:8px 10px;z-index:3}
.svh .a{width:38px;height:38px;font-size:16px}
.svh .nfo{flex:1;min-width:0}
.svh .nfo b{display:block;font-size:15px}
.svh .nfo small{color:#cbd5e1;font-size:12px}
.svh button{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff}
#svb{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#svb img,#svb video{max-width:100%;max-height:100%}
#svb .tx{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:28px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
#stc{display:none;position:fixed;inset:0;z-index:45;flex-direction:column;color:#fff}
#stc .top{display:flex;padding:8px;padding-top:calc(8px + env(safe-area-inset-top))}
#stc .top button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff}
#stct{flex:1;background:none;border:0;outline:0;color:#fff;font-size:28px;font-weight:600;text-align:center;resize:none;padding:20px;display:block;width:100%}
#stct::placeholder{color:#ffffffaa}
#stc .bot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#stc .bot button{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#00000040}
#stc .bot button#stcs{background:#fff;color:#000}
#stcc{border:3px solid #fff!important}
/* sayfalar */
#vb{max-height:100%;overflow:auto;width:100%;text-align:center}
.pd{background:#ffffff14;border-radius:12px;padding:10px 14px;margin:8px 0;text-align:left;width:100%;max-width:340px}
.pd small{color:#cbd5e1;font-size:12px;display:block}
#sp,#subp{display:none;position:fixed;inset:0;background:var(--bg);flex-direction:column}
#sp{z-index:26}#subp{z-index:27}
.pgb{flex:1;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.hero{display:flex;align-items:center;gap:14px;padding:16px;background:var(--pn);margin-bottom:8px;cursor:pointer}
.hero .a{width:64px;height:64px;font-size:26px}
.hero b{display:block;font-size:19px}
.si{display:flex;align-items:center;gap:18px;padding:15px 18px;width:100%;text-align:left}
.si:active{background:var(--bd)}
.si>.i{color:var(--sb)}
.si .tt{flex:1;min-width:0}.si .tt b{display:block;font-weight:500;font-size:16px}
.si>.i:last-child{width:18px;height:18px;opacity:.6}
.si.red{color:#f87171}.si.red>.i{color:#f87171}
.sec{font-size:13px;color:var(--ac);font-weight:600;padding:16px 18px 6px}
.fld{padding:6px 18px}
.fld label{display:block;font-size:12px;color:var(--sb);margin:10px 0 4px}
.fld input:not([type=range]),.fld textarea{width:100%;padding:11px 12px;border-radius:10px;border:0;background:var(--ip);color:var(--tx);font-size:16px;outline:0;font-family:inherit}
.rng{width:100%;accent-color:var(--ac);height:28px}
.btn{display:block;margin:14px 18px;padding:13px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;text-align:center;width:calc(100% - 36px)}
.btn.sec2{background:var(--ip);color:var(--tx)}
.btn.dng{background:#e53935;color:#fff}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;background:var(--ip);font-size:14px}
.seg button.on{background:var(--ac);color:#fff}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--tx)}
.tr{display:flex;align-items:center;gap:14px;padding:12px 18px}
.tr .tt{flex:1}.tr .tt b{display:block;font-weight:500}
.tg{width:46px;height:26px;border-radius:13px;background:var(--ip);position:relative;flex-shrink:0;transition:.2s;border:1px solid var(--bd)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--sb);transition:.2s}
.tg.on{background:var(--ac)}.tg.on::after{left:22px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px}
.chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:20px;background:var(--ip);font-size:14px}
.chip i{width:14px;height:14px;border-radius:50%;display:block}
.chip.on{outline:2px solid var(--ac)}
.pav{position:relative;width:110px;height:110px;margin:18px auto 6px}
.pav .a{width:110px;height:110px;font-size:44px}
.pav label{position:absolute;right:0;bottom:0;width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);cursor:pointer}
.pav label .i{width:18px;height:18px}
.note{color:var(--sb);font-size:12.5px;padding:6px 18px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;font-size:15px}.kv span:last-child{color:var(--sb);text-align:right}
.wg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 18px}
.wt{aspect-ratio:3/4;border-radius:10px;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:0 1px 3px #000a}
.wt.on{border-color:var(--ac)}
.wt.d{background:var(--bg);border-color:var(--bd);color:var(--tx);text-shadow:none}
.wt.d.on{border-color:var(--ac)}
</style></head><body>

const ACCENTS = ["#00a884","#3b82f6","#8b5cf6","#ec4899","#ef4444","#f59e0b","#10b981","#06b6d4","#e3b341","#f97316","#84cc16","#64748b"];

  const mode = LS.get("th")||"dark", ac = LS.get("ac")||ACCENTS[0], oc = LS.get("oc")||"";

const shown = new Set(), knownNames = new Set();
let lastDay = "", lastSender = "";
function show(m,parent){
  if(shown.has(m.id)) return;
  shown.add(m.id); knownNames.add(m.sender);
  const live = !parent; parent = parent || box;
  const near = live && box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  const dt = new Date(m.created_at), day = dt.toDateString();
  if(day !== lastDay){
    lastDay = day; lastSender = "";
    const s = el("div","day");
    s.textContent = dt.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
    parent.appendChild(s);
  }
  const mine = m.sender === me;
  const first = m.sender !== lastSender; lastSender = m.sender;
  const row = el("div","row "+(mine?"me":"ot")+(first?" first":""));
  if(!mine){
    const a = el("div","a"+(first?"":" sp")); if(first) a.dataset.av = m.sender;
    row.appendChild(a);
  }
  const b = el("div","m");
  let h = (!mine && first) ? '<div class="n" style="color:'+color(m.sender)+'">'+esc(m.sender)+'</div>' : "";
  if(m.media_url){
    h += m.media_type === "video"
      ? '<video data-src="'+esc(m.media_url)+'" src="'+esc(m.media_url)+'#t=0.1" playsinline preload="'+(lb("dsave",false)?"none":"metadata")+'"></video>'
      : '<img class="p" data-src="'+esc(m.media_url)+'" src="'+esc(m.media_url)+'" loading="lazy" decoding="async">';
  }
  if(m.body) h += '<div>'+linkify(esc(m.body))+'</div>';
  h += '<div class="t">'+dt.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+'</div>';
  b.innerHTML = h;
  row.appendChild(b); parent.appendChild(row);
  if(live){ refreshAv(row); if(near || mine) box.scrollTop = box.scrollHeight; }
}

async function resizeBlob(file,max,q){
  const bm = await createImageBitmap(file);
  const k = Math.min(1, max/Math.max(bm.width,bm.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bm.width*k); c.height = Math.round(bm.height*k);
  c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  if(bm.close) bm.close();
  return new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
async function prep(file){
  if(!file.type.startsWith("image/") || file.type === "image/gif") return file;
  try{
    const b = await resizeBlob(file,1600,.82);
    if(b && b.size < file.size) return new File([b], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"});
  }catch(e){}
  return file;
}
async function uploadFile(file){
  file = await prep(file);
  const name = Date.now() + "_" + file.name.replace(/[^\w.]/g, "_");
  const r = await db.storage.from("media").upload(name, file, {cacheControl:"31536000"});
  if(r.error){ alert("Yüklenemedi: " + r.error.message); return null; }
  return db.storage.from("media").getPublicUrl(name).data.publicUrl;
}
$("f").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  if(file.size > 50*1024*1024){ alert("Dosya 50 MB'dan büyük, sıkıştırıp tekrar dene."); return; }
  $("up").style.display = "block";
  const url = await uploadFile(file);
  $("up").style.display = "none";
  if(!url) return;
  send({media_url:url, media_type: file.type.startsWith("video") ? "video" : "image"});
};

let pendAv = null;
function squareBlob(file,max){
  return new Promise(res=>{
    const i = new Image(), u = URL.createObjectURL(file);
    i.onload = () => {
      const s = Math.min(i.width,i.height), c = document.createElement("canvas");
      c.width = c.height = Math.min(max,s);
      c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b=>res(b),"image/jpeg",.85);
    };
    i.src = u;
  });
}

function normTel(t){
  let d = String(t||"").replace(/[^\d+]/g,""); if(!d) return "";
  if(d.indexOf("00") === 0) d = "+" + d.slice(2);
  if(d[0] === "+") return d.length >= 9 ? d : "";
  if(d[0] === "0") return DEF_CC + d.slice(1);
  if(DEF_CC === "+90" && d.length === 10 && d[0] === "5") return "+90" + d;
  if(d.length >= 11) return "+" + d;
  return "";
}

  const cap = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Contacts;
  if(cap){
    let g;
    try{ g = await (cap.requestPermissions || cap.getPermissions).call(cap); }catch(e){ throw new Error("Rehber izni istenemedi"); }
    const ok = g && (g.contacts === "granted" || g.granted === true || g.contacts === true);
    if(!ok) throw new Error("Rehber izni verilmedi. Telefon ayarlarından uygulamaya Kişiler iznini ver.");
    const r = await cap.getContacts({projection:{name:true, phones:true}});
    return (r.contacts||[]).map(c=>({
      n: (c.name && (c.name.display || [c.name.given,c.name.family].filter(Boolean).join(" "))) || "",
      tels: (c.phones||[]).map(p=>p.number)
    }));
  }
  if(navigator.contacts && navigator.contacts.select){
    const r = await navigator.contacts.select(["name","tel"],{multiple:true});
    return r.map(c=>({n:(c.name||[])[0]||"", tels:c.tel||[]}));
  }
  throw new Error("unsupported");
}
async function syncContacts(){
  const raw = await readContacts();
  const seen = new Map();
  for(const c of raw) for(const t of c.tels){ const n = normTel(t); if(n && !seen.has(n)) seen.set(n, c.n || n); }
  const tels = [...seen.keys()].slice(0,3000);
  const hs = await Promise.all(tels.map(sha));
  const list = tels.map((t,i)=>({n:seen.get(t), t:t, h:hs[i]})).filter(x=>x.h !== myHash);
  const map = {};
  for(let i=0;i<list.length;i+=150){
    const hh = list.slice(i,i+150).map(x=>x.h);
    const r = await db.from("profiles").select("name,phone_hash").in("phone_hash",hh);
    (r.data||[]).forEach(p=>map[p.phone_hash] = p.name);
  }
  LS.set("ctc", JSON.stringify(list)); LS.set("ctm", JSON.stringify(map)); LS.set("lastsync", new Date().toISOString());
}

/* ---------- ARAMA (WebRTC, grup) ---------- */
const TURN = []; // gerekirse buraya TURN sunucusu eklenir
const ICE = [{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}].concat(TURN);
let call = null;
const sig = (t,o) => ch.send({type:"broadcast",event:"sig",payload:Object.assign({t:t,from:myId,name:me},o||{})});

function layout(){
  const n = $("grid").children.length;
  $("grid").className = n<=1 ? "g1" : n===2 ? "g2" : "gN";
}
function addTile(id,name,local){
  const t = el("div","tile"+(local?" loc":"")); t.id = "tl_"+id;
  t.innerHTML = '<div class="a" data-av="'+esc(name)+'"></div><video autoplay playsinline'+(local?" muted":"")+'></video><div class="nm">'+esc(local?"Sen":name)+'</div>';
  $("grid").appendChild(t); refreshAv(t); layout();
  return {t:t, v:t.querySelector("video")};
}
async function joinCall(video){
  if(call) return false;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true, video: video ? {facingMode:"user"} : false});
  }catch(e){ alert("Kamera/mikrofon izni verilmedi: " + e.message + "\nTelefon ayarlarından uygulamaya izin ver."); return false; }
  call = {video:video, peers:{}, local:stream, cam:video, facing:"user"};
  $("grid").innerHTML = "";
  call.lt = addTile(myId,me,true);
  call.lt.v.srcObject = stream;
  if(video) call.lt.v.classList.add("mir");
  $("bc").style.display = $("bf").style.display = video ? "flex" : "none";
  $("bm").className = ""; $("bc").className = "";
  $("bm").innerHTML = ic("mic"); $("bc").innerHTML = ic("video");
  $("call").style.display = "flex"; $("ring").style.display = "none";
  sig("hello");
  return true;
}
function mkPeer(id,name){
  const pc = new RTCPeerConnection({iceServers:ICE});
  const p = {pc:pc, name:name, pend:[], tile:addTile(id,name,false)};
  call.peers[id] = p;
  call.local.getTracks().forEach(tr=>pc.addTrack(tr,call.local));
  pc.onicecandidate = e => { if(e.candidate) sig("ice",{to:id,c:e.candidate}); };
  pc.ontrack = e => { p.tile.v.srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => { if(pc.connectionState==="failed" || pc.connectionState==="closed") dropPeer(id,pc); };
  return p;
}
function dropPeer(id,pc){
  if(!call) return;
  const p = call.peers[id];
  if(!p || (pc && p.pc!==pc)) return;
  try{ p.pc.close(); }catch(e){}
  p.tile.t.remove(); delete call.peers[id]; layout();
}
async function flush(p){ for(const c of p.pend.splice(0)){ try{ await p.pc.addIceCandidate(c); }catch(e){} } }
async function onSig(m){
  if(!call || m.from===myId) return;
  if(m.to && m.to!==myId) return;
  try{
    if(m.t==="hello"){
      if(call.peers[m.from]) return;
      const p = mkPeer(m.from,m.name);
      await p.pc.setLocalDescription(await p.pc.createOffer());
      sig("offer",{to:m.from,sdp:p.pc.localDescription});
    } else if(m.t==="offer"){
      let p = call.peers[m.from];
      if(p){
        if(p.pc.signalingState==="have-local-offer" && myId<m.from) return;
        dropPeer(m.from);
      }
      p = mkPeer(m.from,m.name);
      await p.pc.setRemoteDescription(m.sdp);
      await flush(p);
      await p.pc.setLocalDescription(await p.pc.createAnswer());
      sig("answer",{to:m.from,sdp:p.pc.localDescription});
    } else if(m.t==="answer"){
      const p = call.peers[m.from];
      if(p && p.pc.signalingState==="have-local-offer"){ await p.pc.setRemoteDescription(m.sdp); await flush(p); }
    } else if(m.t==="ice"){
      const p = call.peers[m.from]; if(!p) return;
      if(p.pc.remoteDescription){ try{ await p.pc.addIceCandidate(m.c); }catch(e){} } else p.pend.push(m.c);
    } else if(m.t==="bye"){
      dropPeer(m.from);
    }
  }catch(e){ console.warn("sig hata", e); }
}
function hangup(){
  if(!call) return;
  sig("bye");
  Object.keys(call.peers).forEach(id=>dropPeer(id));
  call.local.getTracks().forEach(t=>t.stop());
  call = null;
  $("call").style.display = "none"; $("grid").innerHTML = "";
}
async function startCall(video){
  if(call) return;
  if(!(await joinCall(video))) return;
  ch.send({type:"broadcast",event:"ring",payload:{name:me,video:video}});
  send({}, (video?"Görüntülü":"Sesli")+" arama başlattı, katılmak için üstteki butonlara bas");
}
let ringT, ringVideo = false;
function incoming(p){
  if(call) return;
  ringVideo = !!p.video;
  $("rt").innerHTML = ic(p.video?"video":"phone") + "<span style='display:block'>" + esc(p.name) + " arıyor</span>";
  $("ring").style.display = "flex";
  if(navigator.vibrate && lb("vib",true)) navigator.vibrate([300,150,300]);
  clearTimeout(ringT); ringT = setTimeout(()=>$("ring").style.display="none", 40000);
}
$("rj").onclick = () => { clearTimeout(ringT); joinCall(ringVideo); };
$("rn").onclick = () => { clearTimeout(ringT); $("ring").style.display = "none"; };

};
$("bc").onclick = () => {
  if(!call || !call.video) return;
  const t = call.local.getVideoTracks()[0]; if(!t) return;
  t.enabled = !t.enabled; call.cam = t.enabled; $("bc").classList.toggle("off",!t.enabled);
  $("bc").innerHTML = ic(t.enabled ? "video" : "videooff");
};
$("bf").onclick = async () => {
  if(!call || !call.video) return;
  const old = call.local.getVideoTracks()[0];
  const next = call.facing==="user" ? "environment" : "user";
  try{
    if(old){ old.stop(); call.local.removeTrack(old); }
    const ns = await navigator.mediaDevices.getUserMedia({video:{facingMode:next}});
    const nt = ns.getVideoTracks()[0]; nt.enabled = call.cam;
    Object.values(call.peers).forEach(p=>{ const s = p.pc.getSenders().find(s=>s.track===null || (s.track && s.track.kind==="video")); if(s) s.replaceTrack(nt); });
    call.local.addTrack(nt); call.facing = next;
    call.lt.v.srcObject = call.local;
    call.lt.v.classList.toggle("mir", next==="user");
  }catch(e){ alert("Kamera çevrilemedi: " + e.message); }
};

let pendPhone = "", cdT = null;
const authErr = m => { $("a-err").textContent = m || ""; };

function niceErr(msg){

  if(/provider|unsupported phone|sms/i.test(m)) return "SMS gönderilemedi. Supabase'de telefon girişi ve SMS sağlayıcısı ayarlanmamış olabilir.";

function countdown(s){

  const tick = () => { if(s <= 0){ clearInterval(cdT); b.disabled = false; b.textContent = "Kodu tekrar gönder"; } else { b.textContent = "Tekrar gönder ("+s+")"; s--; } };
  tick(); cdT = setInterval(tick,1000);

async function sendCode(){
  const p = phoneFromInput();
  if(p.replace(/\D/g,"").length < 9){ authErr("Telefon numarasını kontrol et"); return; }
  authErr(""); const b = $("a-send"); b.disabled = true; b.textContent = "Gönderiliyor...";
  const r = await db.auth.signInWithOtp({phone:p});
  b.disabled = false; b.textContent = "Kod gönder";
  if(r.error){ authErr(niceErr(r.error.message)); return; }
  pendPhone = p; $("a1").style.display = "none"; $("a2").style.display = "flex";
  $("ot").value = ""; $("ot").focus(); countdown(30);
}
async function verifyCode(){
  const t = $("ot").value.replace(/\D/g,"");
  if(t.length < 6){ authErr("6 haneli kodu gir"); return; }
  authErr(""); const b = $("a-ver"); b.disabled = true; b.textContent = "Doğrulanıyor...";
  const r = await db.auth.verifyOtp({phone:pendPhone, token:t, type:"sms"});
  b.disabled = false; b.textContent = "Doğrula";
  if(r.error || !r.data || !r.data.user){ authErr(niceErr(r.error ? r.error.message : "Doğrulanamadı")); return; }
  enter(r.data.user);
}
$("a-send").onclick = sendCode;
$("pn").onkeydown = e => { if(e.key === "Enter") sendCode(); };
$("a-ver").onclick = verifyCode;
$("ot").oninput = e => { e.target.value = e.target.value.replace(/\D/g,"").slice(0,6); if(e.target.value.length === 6) verifyCode(); };
$("a-re").onclick = async () => {
  authErr(""); const r = await db.auth.signInWithOtp({phone:pendPhone});
  if(r.error){ authErr(niceErr(r.error.message)); return; } countdown(30);
};
$("a-back").onclick = () => { clearInterval(cdT); authErr(""); $("a2").style.display = "none"; $("a1").style.display = "flex"; };

async function enter(user){
  uid = user.id;
  const p = user.phone || "";
  myE164 = p[0] === "+" ? p : "+" + p;
  myHash = await sha(myE164);
  const err = await loadProfiles();
  if(err){ showAuth(); authErr("Veritabanı hazır değil: " + err); return; }
  let mine = Object.values(profiles).find(x=>x.user_id === uid);
  if(!mine){
    const old = LS.get("ad");
    if(old && profiles[old] && !profiles[old].user_id){
      const r = await db.from("profiles").update({user_id:uid, phone_hash:myHash}).eq("name",old).is("user_id",null).select(PC);
      if(r.data && r.data[0]) mine = r.data[0];
    }
  }
  if(!mine){
    let nm = "Kullanıcı " + myE164.slice(-4);
    for(let k=0; k<5 && !mine; k++){
      const r = await db.from("profiles").insert({name:nm, user_id:uid, phone_hash:myHash, extra:{}}).select(PC).single();
      if(r.data) mine = r.data; else nm = "Kullanıcı " + myE164.slice(-4) + " " + (10+Math.floor(Math.random()*90));
    }
  }
  if(!mine){ showAuth(); authErr("Profil oluşturulamadı"); return; }
  profiles[mine.name] = mine; me = mine.name; LS.set("ad", me);
  hideAuth(); startApp();
}
async function startApp(){
  if(started) return; started = true;
  applyTheme();
  setupChannel();
  await reloadMessages();
  updSub();
  loadStatuses();
  if(!LS.get("ctask")) setTimeout(askContacts, 600);
}

/* ---------- BAŞLAT ---------- */
(async () => {
  let s = null;
  try{ s = (await db.auth.getSession()).data.session; }catch(e){}
  if(s && s.user) enter(s.user); else showAuth();
})();
