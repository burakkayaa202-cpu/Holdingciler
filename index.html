<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202c33" id="tc">
<title>Sohbet Odası</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0b141a;--pn:#202c33;--hd:#202c33;--htx:#e9edef;--in:#202c33;--out:#005c4b;--itx:#e9edef;--otx:#e9edef;--tx:#e9edef;--sb:#8696a0;--ac:#00a884;--actx:#fff;--ip:#2a3942;--bd:#ffffff14;--fs:16px;--br:16px;--ff:system-ui,-apple-system,sans-serif;--gap:2px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);display:flex;flex-direction:column;height:100dvh;overflow:hidden;overscroll-behavior:none;position:relative}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;pointer-events:none}
header{background:var(--hd);color:var(--htx);padding:8px 8px 8px 4px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;box-shadow:0 1px 0 var(--bd);z-index:2}
header .info{flex:1;min-width:0;cursor:pointer}
header b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.72;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.ib:active{background:var(--bd)}
#msgs{flex:1;overflow-y:auto;padding:8px 10px 84px;display:flex;flex-direction:column;background:var(--bg);overscroll-behavior:contain}
.day{align-self:center;background:var(--pn);color:var(--sb);font-size:12px;padding:4px 12px;border-radius:10px;margin:12px 0 4px}
.older{align-self:center;background:var(--pn);color:var(--tx);font-size:13px;padding:8px 16px;border-radius:16px;margin:4px 0 8px}
.row{display:flex;gap:6px;align-items:flex-end;margin-top:var(--gap)}
.row.first{margin-top:10px}
.row.me{justify-content:flex-end}
.a{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;font-size:14px}
.a img{width:100%;height:100%;object-fit:cover;display:block}
.a .i{width:55%;height:55%}
.a.sp{visibility:hidden}
.m{max-width:78%;padding:7px 10px 5px;border-radius:var(--br);background:var(--in);color:var(--itx);box-shadow:0 1px 1px #0002;overflow-wrap:anywhere;line-height:1.35;font-size:var(--fs);position:relative;user-select:none}
.row.ot.first .m{border-top-left-radius:min(4px,var(--br))}
.row.me.first .m{border-top-right-radius:min(4px,var(--br))}
.row.me .m{background:var(--out);color:var(--otx)}
.m a{color:inherit;text-decoration:underline}
.n{font-size:.78em;font-weight:600;margin-bottom:2px;cursor:pointer}
.m img.p,.m video{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:3px 0;cursor:pointer}
.t{font-size:.66em;opacity:.65;text-align:right;margin-top:2px}
body.noT .t{display:none}
body.noAnim *{animation:none!important;transition:none!important}
#up{display:none;background:var(--pn);color:var(--ac);text-align:center;font-size:13px;padding:6px}
footer{display:flex;gap:8px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--hd);color:var(--htx);align-items:center;z-index:2}
#t{flex:1;min-width:0;padding:11px 16px;border-radius:24px;border:0;background:var(--ip);color:var(--tx);font-size:16px;outline:0}
#t::placeholder{color:var(--sb)}
#s{background:var(--ac);color:var(--actx);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.clip{opacity:.75;width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:#000c;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:300;max-width:86%;text-align:center}

/* Sağ alt hızlı aksiyon butonu (Kişiler / Grup Kur) */
#fab-new{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:16px;background:var(--ac);color:var(--actx);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #0007;z-index:12}
#fab-new:active{transform:scale(.96)}

/* Görüntüleyici & Özel Kişi / Grup Profili */
#v{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;flex-direction:column;color:var(--tx);overflow-y:auto}
#v.media-mode{background:#000e;color:#fff;align-items:center;justify-content:center}
#v.media-mode #vb{display:flex;align-items:center;justify-content:center;height:100%;padding:0}
#v img.big,#v video{max-width:100%;max-height:100%}
#vb{width:100%;min-height:100%;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
#x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;background:#0007;color:#fff;z-index:42;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.prof-top{background:var(--pn);padding:calc(56px + env(safe-area-inset-top)) 20px 24px;text-align:center;border-bottom:1px solid var(--bd)}
.prof-top .a{width:112px;height:112px;font-size:46px;margin:0 auto 14px;box-shadow:0 6px 20px #0004}
.prof-top h2{margin:0;font-size:22px}
.prof-top p{margin:6px 0 0;color:var(--sb);font-size:13px}
.prof-acts{display:flex;justify-content:center;gap:12px;padding:16px;flex-wrap:wrap}
.prof-act{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--pn);padding:12px 16px;border-radius:14px;min-width:86px;font-size:13px;border:1px solid var(--bd)}
.prof-act .i{color:var(--ac)}
.prof-card{background:var(--pn);margin:10px 16px;border-radius:14px;padding:12px 14px;border:1px solid var(--bd)}
.prof-card small{display:block;color:var(--sb);font-size:12px;margin-bottom:4px}
.prof-card div{font-size:15px;overflow-wrap:anywhere}

/* Mesaj aksiyon menüsü (Kendinden sil / Herkesten sil / Kopyala) */
#msgact{display:none;position:fixed;inset:0;background:#0008;z-index:65;align-items:flex-end}
#msgact .box{background:var(--pn);width:100%;border-radius:18px 18px 0 0;padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
#msgact button{display:flex;align-items:center;gap:14px;width:100%;padding:15px 20px;font-size:16px;text-align:left}
#msgact button:active{background:var(--bd)}
#msgact button.red{color:#ff6b6b}

/* menü */
#mback{display:none;position:fixed;inset:0;z-index:49}
#menu{display:none;position:fixed;top:calc(52px + env(safe-area-inset-top));left:8px;background:var(--pn);border-radius:14px;box-shadow:0 8px 28px #0009;z-index:50;min-width:255px;max-height:80dvh;overflow-y:auto}
#menu .mh{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--bd)}
#menu .mh .a{width:44px;height:44px;font-size:18px}
#menu .mh b{display:block;font-size:16px}
#menu button.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;font-size:15px;text-align:left}
#menu button.mi:active{background:var(--bd)}
#menu button.mi .i{color:var(--sb)}
.msep{height:1px;background:var(--bd);margin:4px 0}
.msec-lbl{padding:8px 16px 4px;font-size:11px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.4px}
.m-chat-row{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer}
.m-chat-row:active{background:var(--bd)}
.m-chat-row.on{background:var(--bd)}
.m-chat-row .a{width:34px;height:34px;font-size:14px}
.m-chat-row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}

/* giriş */
#lg{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;overflow:auto}
#lg img{width:96px;height:96px;border-radius:24px}
#lg h2{margin:4px 0 8px;font-size:24px}
#lg .lf{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#lg select,#lg input{width:100%;padding:13px 14px;border-radius:12px;border:0;background:var(--ip);color:var(--tx);font-size:17px;outline:0}
#lg .btn{margin:0;width:100%}
.err{color:#ff6b6b;font-size:14px;min-height:20px;text-align:center}

/* sayfalar */
#sp,#subp{display:none;position:fixed;inset:0;background:var(--bg);flex-direction:column}
#sp{z-index:26}#subp{z-index:27}
.pgb{flex:1;overflow-y:auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.hero{display:flex;align-items:center;gap:14px;padding:16px;background:var(--pn);margin-bottom:8px;cursor:pointer}
.hero .a{width:64px;height:64px;font-size:26px}
.hero b{display:block;font-size:19px}
.si{display:flex;align-items:center;gap:18px;padding:15px 18px;width:100%;text-align:left;font-size:16px}
.si:active{background:var(--bd)}
.si>.i{color:var(--sb)}
.si .tt{flex:1;min-width:0}
.si .tt small{display:block;color:var(--sb);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .i:last-child{width:18px;height:18px;opacity:.6}
.si.red{color:#ff6b6b}.si.red>.i{color:#ff6b6b}
.sec{font-size:13px;color:var(--ac);font-weight:600;padding:16px 18px 6px}
.fld{padding:6px 18px}
.fld label{display:flex;justify-content:space-between;font-size:13px;color:var(--sb);margin:10px 0 5px}
.fld input,.fld textarea{width:100%;padding:11px 12px;border-radius:10px;border:0;background:var(--ip);color:var(--tx);font-size:16px;outline:0;font-family:inherit}
.fld input[type=range]{padding:0;background:none;accent-color:var(--ac);height:28px}
.fld input:disabled{opacity:.6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 18px;padding:13px;border-radius:12px;background:var(--ac);color:var(--actx);font-weight:600;text-align:center;width:calc(100% - 36px)}
.btn:disabled{opacity:.6}
.btn.sec2{background:var(--ip);color:var(--tx)}
.btn.dng{background:#e53935;color:#fff}
.tr{display:flex;align-items:center;gap:14px;padding:13px 18px;font-size:16px}
.tr .tt{flex:1}
.tg{width:46px;height:26px;border-radius:13px;background:var(--ip);position:relative;flex-shrink:0;transition:.2s;border:1px solid var(--bd)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--sb);transition:.2s}
.tg.on{background:var(--ac)}.tg.on::after{left:22px;background:var(--actx)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;background:var(--ip);font-size:14px}
.seg button.on{background:var(--ac);color:var(--actx)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px}
.chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:20px;background:var(--ip);font-size:14px}
.chip i{width:14px;height:14px;border-radius:50%;display:block}
.chip.on{outline:2px solid var(--ac)}
.cr{display:flex;align-items:center;gap:14px;padding:12px 18px;width:100%;text-align:left;font-size:16px}
.cr:active{background:var(--bd)}
.cr i{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);display:block;flex-shrink:0}
.pav{position:relative;width:110px;height:110px;margin:18px auto 14px}
.pav .a{width:110px;height:110px;font-size:44px}
.pav label{position:absolute;right:0;bottom:0;width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--actx);display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);cursor:pointer}
.pav label .i{width:18px;height:18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;font-size:15px}.kv span:last-child{color:var(--sb);text-align:right}
.empty{color:var(--sb);text-align:center;padding:26px 24px;font-size:14px;line-height:1.5}
.note{padding:8px 18px;font-size:14px;line-height:1.5}
.note a{color:var(--ac)}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 18px}
.wt{aspect-ratio:3/4;border-radius:12px;position:relative;overflow:hidden;border:3px solid transparent;background-color:var(--ip);cursor:pointer}
.wt.on{border-color:var(--ac)}
.wt span{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:11px;padding:3px;text-align:center}
.wt.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px}
#prv{padding:14px 10px;display:flex;flex-direction:column;margin:0 0 6px;background:var(--bg)}
.sti{display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer}
.sti:active{background:var(--bd)}
.sti .a{width:50px;height:50px;font-size:20px}
.sti .nfo{flex:1;min-width:0}
.sti .nfo b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sti .nfo small{color:var(--sb);font-size:13px}
.mini{padding:8px 14px;border-radius:18px;background:var(--ac);color:var(--actx);font-size:13px;font-weight:600;flex-shrink:0}
.mini.alt{background:var(--ip);color:var(--tx)}
.srch{width:100%;padding:11px 14px;border-radius:22px;border:0;background:var(--ip);color:var(--tx);font-size:16px;outline:0}
.mchk{width:22px;height:22px;border-radius:50%;border:2px solid var(--sb);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mchk.on{background:var(--ac);border-color:var(--ac);color:var(--actx)}

/* renk seçici */
#cps{display:none;position:fixed;inset:0;background:#0008;z-index:60;align-items:flex-end}
#cps .box{background:var(--pn);width:100%;border-radius:18px 18px 0 0;padding:16px 18px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.cph{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.cph i{width:44px;height:44px;border-radius:50%;display:block;border:2px solid var(--bd)}
.cph b{flex:1}
.cph input{width:104px;padding:9px 10px;border-radius:10px;border:0;background:var(--ip);color:var(--tx);font-size:16px;outline:0;text-transform:uppercase}
.cpr{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sb)}
.cpr span{width:84px}
.cpr input{flex:1;accent-color:var(--ac);height:30px}
.cpsw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:10px 0}
.cpsw button{aspect-ratio:1;border-radius:50%;border:2px solid var(--bd)}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:12px;border-radius:12px;background:var(--ip);font-weight:600}
.acts button.pri{background:var(--ac);color:var(--actx)}

/* arama */
#call{display:none;position:fixed;inset:0;background:#0d0d0d;z-index:20;flex-direction:column;color:#fff}
#grid{flex:1;display:grid;gap:4px;padding:4px;padding-top:calc(4px + env(safe-area-inset-top));position:relative;min-height:0}
#grid.g1,#grid.g2{grid-template-columns:1fr}
#grid.gN{grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.tile{position:relative;background:#222;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile video.mir{transform:scaleX(-1)}
.tile .a{width:84px;height:84px;font-size:34px}
.tile .nm{position:absolute;left:8px;bottom:8px;font-size:13px;background:#0009;padding:2px 9px;border-radius:10px;z-index:2}
#grid.g2 .tile.loc{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));width:100px;height:140px;z-index:3;box-shadow:0 2px 10px #000a}
#grid.g2 .tile.loc .a{width:48px;height:48px;font-size:20px}
#grid.g2 .tile.loc .nm{display:none}
#ctl{display:flex;justify-content:center;gap:16px;padding:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#ctl button{width:58px;height:58px;border-radius:50%;background:#ffffff26;display:flex;align-items:center;justify-content:center;color:#fff}
#ctl button.off{background:#fff;color:#000}
#ctl button.red{background:#e53935;color:#fff}
#ctl button.red .i{transform:rotate(135deg)}
#ring{display:none;position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));background:var(--pn);color:var(--tx);z-index:35;border-radius:16px;padding:12px;box-shadow:0 6px 24px #0008;align-items:center;gap:10px}
#ring span{flex:1;font-size:15px;display:flex;align-items:center;gap:8px}
#ring button{padding:10px 16px;border-radius:12px;background:var(--ac);color:var(--actx);font-weight:600}
#ring button.no{background:var(--ip);color:var(--tx);padding:10px 12px;display:flex}

/* durum */
#stp{display:none;position:fixed;inset:0;background:var(--bg);z-index:25;flex-direction:column}
#stl{flex:1;overflow-y:auto;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.sh{font-size:13px;color:var(--sb);padding:14px 16px 6px;font-weight:600}
.rg{padding:3px;border-radius:50%;border:3px solid var(--ac);flex-shrink:0}
.rg.seen{border-color:var(--sb)}
.rg.none{border-color:transparent;position:relative}
.plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:var(--actx);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.plus .i{width:14px;height:14px;stroke-width:3}
#stfab{position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--actx);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0008}
#ssheet{display:none;position:fixed;inset:0;background:#0008;z-index:48;align-items:flex-end}
#ssheet .box{background:var(--pn);width:100%;border-radius:18px 18px 0 0;padding:10px 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#ssheet button,#ssheet label{display:flex;align-items:center;gap:16px;width:100%;padding:16px 22px;font-size:16px;text-align:left;cursor:pointer}
#ssheet button:active,#ssheet label:active{background:var(--bd)}
#stv{display:none;position:fixed;inset:0;background:#000;z-index:45;flex-direction:column;color:#fff}
.pbs{display:flex;gap:4px;padding:8px 10px 0;padding-top:calc(8px + env(safe-area-inset-top));z-index:3}
.pb{flex:1;height:3px;background:#ffffff55;border-radius:2px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#fff}
.pb.done i,.pb.curv i{width:100%}
.pb.cur i{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.svh{display:flex;align-items:center;gap:10px;padding:8px 10px;z-index:3}
.svh .a{width:38px;height:38px;font-size:16px}
.svh .nfo{flex:1;min-width:0}
.svh .nfo b{display:block;font-size:15px}
.svh .nfo small{color:#cbd5e1;font-size:12px}
.svh button{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff}
#svb{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#svb img,#svb video{max-width:100%;max-height:100%}
#svb .tx{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:28px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
#stc{display:none;position:fixed;inset:0;z-index:45;flex-direction:column;color:#fff}
#stc .top{display:flex;padding:8px;padding-top:calc(8px + env(safe-area-inset-top))}
#stc .top button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff}
#stct{flex:1;background:none;border:0;outline:0;color:#fff;font-size:28px;font-weight:600;text-align:center;resize:none;padding:20px;display:block;width:100%}
#stct::placeholder{color:#ffffffaa}
#stc .bot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#stc .bot button{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#00000040}
#stc .bot button#stcs{background:#fff;color:#000}

  if(!chatId || !chatId.startsWith("dm:")) return null;

};

  const r = msgRoom || ROOM_GENERAL;
  if(currentRoom === ROOM_GENERAL) return r === ROOM_GENERAL || r === "general";

};
const canSeeInChat = (msgRoom, user) => {
  const r = msgRoom || ROOM_GENERAL;
  if(r === ROOM_GENERAL || r === "general") return true;

    if(!g) return true;

};

/* ================= RENK / TEMA (GENEL + SOHBETE ÖZEL) ================= */
const mix = (h,t,a) => { const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const x=p(h),y=p(t);
  return "#"+x.map((v,i)=>Math.round(v*(1-a)+y[i]*a).toString(16).padStart(2,"0")).join(""); };
const lum = h => { const p=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)); return .2126*p[0]+.7152*p[1]+.0722*p[2]; };
const onC = (h,l,d) => lum(h) > .45 ? (d||"#111b21") : (l||"#fff");
function hsl2hex(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join(""); }
function hex2hsl(hx){ const r=parseInt(hx.slice(1,3),16)/255,g=parseInt(hx.slice(3,5),16)/255,b=parseInt(hx.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; }
  return [Math.round(h),Math.round(s*100),Math.round(l*100)]; }

/* ================= İNTERNET / GÖRSEL YARDIMCILARI ================= */
function shrink(file,max,q,asURL){
  return new Promise(res=>{
    const i = new Image(), u = URL.createObjectURL(file);
    i.onload = () => {
      const k = Math.min(1, max/Math.max(i.width,i.height)), c = document.createElement("canvas");
      c.width = Math.round(i.width*k); c.height = Math.round(i.height*k);
      c.getContext("2d").drawImage(i,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      if(asURL) res(c.toDataURL("image/jpeg",q)); else c.toBlob(b=>res(b||file),"image/jpeg",q);
    };
    i.onerror = () => { URL.revokeObjectURL(u); res(asURL?"":file); };
    i.src = u;
  });
}
function squareBlob(file,max){
  return new Promise(res=>{
    const i = new Image(), u = URL.createObjectURL(file);
    i.onload = () => {
      const s = Math.min(i.width,i.height), c = document.createElement("canvas");
      c.width = c.height = Math.min(max,s);
      c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,c.width,c.height);
      URL.revokeObjectURL(u); c.toBlob(b=>res(b),"image/jpeg",.85);
    };
    i.src = u;
  });
}
async function uploadFile(file){
  let body = file;
  if(file.type.startsWith("image/") && file.type !== "image/gif" && file.size > 300*1024) body = await shrink(file,1600,.8);
  let nm = file.name.replace(/[^\w.]/g,"_"); if(body !== file) nm = nm.replace(/\.[^.]*$/,"") + ".jpg";
  const name = Date.now() + "_" + nm;
  const r = await db.storage.from("media").upload(name, body, {contentType: body.type || file.type});
  if(r.error){ alert("Yüklenemedi: " + r.error.message); return null; }
  return db.storage.from("media").getPublicUrl(name).data.publicUrl;
}

const CCS = [["+90","Türkiye"],["+49","Almanya"],["+44","Birleşik Krallık"],["+1","ABD / Kanada"],["+31","Hollanda"],["+33","Fransa"],["+32","Belçika"],["+43","Avusturya"],["+41","İsviçre"],["+39","İtalya"],["+34","İspanya"],["+46","İsveç"],["+7","Rusya"],["+380","Ukrayna"],["+994","Azerbaycan"],["+357","Kıbrıs"],["+966","Suudi Arabistan"],["+971","BAE"],["+974","Katar"],["+20","Mısır"],["+81","Japonya"],["+82","Güney Kore"],["+61","Avustralya"]];
const isPh = n => /^\+\d{6,}$/.test(n||"");
function fmtPhone(n){
  if(!isPh(n)) return n || "";
  const d = n.slice(1);
  if(n.startsWith("+90") && d.length === 12) return "+90 "+d.slice(2,5)+" "+d.slice(5,8)+" "+d.slice(8,10)+" "+d.slice(10);
  return "+" + d.match(/.{1,3}/g).join(" ");
}
function ownCC(){
  const list = CCS.map(c=>c[0]).sort((a,b)=>b.length-a.length);
  return list.find(c=>String(me).startsWith(c)) || LS.get("cc") || "+90";
}
function normContact(raw){
  let d = String(raw||"").replace(/[^\d+]/g,"");
  if(!d) return "";
  if(d[0] === "+") return "+" + d.slice(1).replace(/\D/g,"");
  if(d.startsWith("00")) return "+" + d.slice(2);
  if(d[0] === "0") return ownCC() + d.replace(/^0+/,"");
  if(d.length <= 10) return ownCC() + d;
  return "+" + d;
}
let cmap = J("cmap",{});
const dn = n => n === me ? "Sen" : (cmap[n] || (isPh(n) ? fmtPhone(n) : n));

function avUrl(n){ const p = profiles[n]; if(!p || !p.avatar_url) return ""; if(n !== me && ((getExtra(n).priv||{}).photo) === "none") return ""; return p.avatar_url; }

async function saveProfile(over){
  over = over || {};
  const cur = profiles[me] || {};
  const extra = Object.assign({}, getExtra(me), over.extra || {});
  if(over.priv) extra.priv = Object.assign({}, extra.priv||{}, over.priv);
  const prof = {name:me, avatar_url: over.avatar_url !== undefined ? over.avatar_url : (cur.avatar_url||null), status:"", extra:extra};
  SJ("extra",extra);
  let warn = false, r = await db.from("profiles").upsert(prof);
  if(r.error){ r = await db.from("profiles").upsert({name:prof.name, avatar_url:prof.avatar_url, status:""}); warn = true; }
  if(r.error) return {ok:false, msg:r.error.message};
  profiles[me] = prof; SJ("pc",profiles); refreshAv();
  return {ok:true, warn:warn};

/* ================= MESAJLAR, SİLME (KENDİNDEN / HERKESTEN) & ANLIK YAKALAMA ================= */
const knownNames = new Set(), shown = new Set();
let ALL_MSGS = [], VIEW_MSGS = [], hasOlder = false;

function isMessageVisible(m){
  if(!m || !m.id) return false;
  if(hiddenMsgIds.has(String(m.id))) return false;
  const r = m.room_id || ROOM_GENERAL;
  if(!canSeeInChat(r, me)) return false;
  if(!isSameChat(r, activeChat)) return false;
  const clr = clearedAtMap[activeChat];
  if(clr && m.created_at && m.created_at <= clr) return false;
  return true;
}

function rowFor(m,st){
  const frag = document.createDocumentFragment();
  const dt = new Date(m.created_at), day = dt.toDateString();
  if(day !== st.day){
    st.day = day; st.sender = "";
    const s = el("div","day"); s.textContent = dt.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}); frag.appendChild(s);
  }
  const mine = m.sender === me, first = m.sender !== st.sender; st.sender = m.sender;
  const row = el("div","row "+(mine?"me":"ot")+(first?" first":""));
  if(!mine){ const a = el("div","a"+(first?"":" sp")); if(first) a.dataset.av = m.sender; row.appendChild(a); }
  const b = el("div","m");
  b.dataset.mid = String(m.id);
  let h = (!mine && first) ? '<div class="n" data-nm="'+esc(m.sender)+'" style="color:'+color(m.sender)+'">'+esc(dn(m.sender))+'</div>' : "";
  if(m.media_url){
    h += m.media_type === "video"
      ? '<video src="'+esc(m.media_url)+'#t=0.1" data-src="'+esc(m.media_url)+'" data-mt="video" playsinline preload="'+(lb("dsave",false)?"none":"metadata")+'"></video>'
      : '<img class="p" src="'+esc(m.media_url)+'" data-src="'+esc(m.media_url)+'" data-mt="image" loading="lazy" decoding="async">';
  }
  if(m.body) h += '<div>'+linkify(esc(m.body))+'</div>';
  h += '<div class="t">'+dt.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+'</div>';
  b.innerHTML = h; row.appendChild(b); frag.appendChild(row);
  return frag;
}

function rebuildChatView(keepScroll){
  const ph = box.scrollHeight, pt = box.scrollTop;
  VIEW_MSGS = ALL_MSGS.filter(isMessageVisible);
  const st = {day:"", sender:""};
  const frag = document.createDocumentFragment();
  if(hasOlder && activeChat === ROOM_GENERAL){
    const o = el("button","older"); o.id = "older"; o.textContent = "Eski mesajları yükle"; frag.appendChild(o);
  }
  VIEW_MSGS.forEach(m=>frag.appendChild(rowFor(m,st)));
  box.innerHTML = "";
  if(!VIEW_MSGS.length){
    const emp = el("div","empty");
    emp.textContent = activeChat === ROOM_GENERAL ? "Henüz mesaj yok." : "Bu sohbette henüz mesaj yok. İlk mesajı sen gönder!";
    box.appendChild(emp);
  } else {
    box.appendChild(frag);
    refreshAv(box);
  }
  box.scrollTop = keepScroll ? Math.max(0, box.scrollHeight - ph + pt) : box.scrollHeight;
}

let cacheT = 0;
function saveCache(){ clearTimeout(cacheT); cacheT = setTimeout(()=>SJ("mc",ALL_MSGS.slice(-120)),900); }

function removeMsgLocally(msgId){
  const sid = String(msgId);
  ALL_MSGS = ALL_MSGS.filter(x=>String(x.id) !== sid);
  shown.delete(sid);
  saveCache();
  rebuildChatView(true);
}

async function deleteMsgForMe(msgId){
  hiddenMsgIds.add(String(msgId));
  SJ("hidden_msgs", [...hiddenMsgIds]);
  rebuildChatView(true);

}

async function deleteMsgForEveryone(msg){
  const sid = String(msg.id);
  removeMsgLocally(sid);
  try{
    const q = db.from("messages").delete();
    if(typeof msg.id === "number" || /^\d+$/.test(sid)) await q.eq("id", Number(sid));
    else await q.eq("id", sid);
  }catch(e){}
  bc("msg_delete", {id: msg.id, room_id: msg.room_id || ROOM_GENERAL, by: me});
  toast("Mesaj herkesten silindi");
}

function openMessageActions(msg){
  if(!msg) return;

  let html = "";

    html += '<button id="ma-copy">'+ic("text")+'<span>Metni kopyala</span></button>';
  }

function ingestIncomingMessage(m, fromRealtime){
  if(!m || !m.id) return;
  const sid = String(m.id);
  const r = m.room_id || ROOM_GENERAL;
  if(!canSeeInChat(r, me)) return;

  if(!shown.has(sid)){
    shown.add(sid);
    knownNames.add(m.sender);
    if(r.startsWith("dm:")){
      const peer = otherInDm(r, me);
      if(peer) trackRecentDM(peer);
    }
    ALL_MSGS.push(m);
    ALL_MSGS.sort((a,b)=>new Date(a.created_at) - new Date(b.created_at));
    saveCache();

    if(isSameChat(r, activeChat) && isMessageVisible(m)){
      const near = box.scrollHeight - box.scrollTop - box.clientHeight < 180;
      rebuildChatView(!near && m.sender !== me);
      if(near || m.sender === me) box.scrollTop = box.scrollHeight;
    }

    if(fromRealtime && m.sender !== me){
      const senderLabel = dn(m.sender);
      const chatLabel = r === ROOM_GENERAL ? "Sohbet Odası" : (r.startsWith("grp:") ? ((groups[r]&&groups[r].name)||"Grup") : senderLabel);
      const bodyPreview = m.body || (m.media_type === "video" ? "Video gönderdi" : (m.media_url ? "Fotoğraf gönderdi" : "Yeni mesaj"));
      if(!isSameChat(r, activeChat) || document.hidden || !document.hasFocus()){
        pushLocalNotif(chatLabel, (r === ROOM_GENERAL || r.startsWith("grp:") ? senderLabel + ": " : "") + bodyPreview, r);
      }
      if(!isSameChat(r, activeChat)){
        toast(chatLabel + ": " + bodyPreview);
      }
    }
  }
}

const histN = () => +(LS.get("hist")||100);
async function fetchLatest(){
  const N = histN();
  const r = await db.from("messages").select().order("created_at",{ascending:false}).limit(N);
  const rows = (r.data||[]).reverse();
  ALL_MSGS = rows;
  shown.clear();
  rows.forEach(m=>{
    shown.add(String(m.id));
    knownNames.add(m.sender);
    const rm = m.room_id || ROOM_GENERAL;
    if(rm.startsWith("dm:")){ const peer = otherInDm(rm, me); if(peer) trackRecentDM(peer); }
  });
  hasOlder = rows.length === N;
  rebuildChatView(false);
  saveCache();
}
async function initMessages(){
  const cache = J("mc",[]);
  if(cache.length){
    ALL_MSGS = cache;
    cache.forEach(m=>{ shown.add(String(m.id)); knownNames.add(m.sender); });
    rebuildChatView(false);
    const lastTs = cache[cache.length-1].created_at;
    const r = await db.from("messages").select().gt("created_at",lastTs).order("created_at",{ascending:true}).limit(500);
    (r.data||[]).forEach(m=>ingestIncomingMessage(m, false));
  }
  await fetchLatest();
}
async function loadOlder(){
  if(!ALL_MSGS.length) return;
  const r = await db.from("messages").select().lt("created_at",ALL_MSGS[0].created_at).order("created_at",{ascending:false}).limit(50);
  const rows = (r.data||[]).reverse();
  rows.forEach(m=>{ shown.add(String(m.id)); knownNames.add(m.sender); });
  ALL_MSGS = rows.concat(ALL_MSGS);
  hasOlder = rows.length === 50;
  rebuildChatView(true);
}

async function send(extra,text){
  extra = extra || {};
  const body = text !== undefined ? text : $("t").value.trim();
  if(!body && !extra.media_url) return;
  if(text === undefined) $("t").value = "";
  const payload = Object.assign({sender:me, body:body, room_id:activeChat}, extra);
  let r = await db.from("messages").insert(payload).select().single();
  if(r.error && String(r.error.message||"").toLowerCase().includes("room_id")){
    const fallback = Object.assign({sender:me, body:body}, extra);
    r = await db.from("messages").insert(fallback).select().single();
  }
  if(r.error){ alert("Gönderilemedi: " + r.error.message); return; }
  const saved = Object.assign({room_id: activeChat}, r.data);
  ingestIncomingMessage(saved, false);
  bc("new_msg", {msg: saved});
}

  $("up").style.display = "none";

};

function pickColor(title,cur,cb){
  const orig = cur; let hsl = hex2hsl(cur);
  const upd = fromHex => {
    const hx = fromHex || hsl2hex(hsl[0],hsl[1],hsl[2]);
    $("cp-pv").style.background = hx; $("cp-hex").value = hx;
    if(!fromHex){ cb(hx); } else { hsl = hex2hsl(hx); $("cp-h").value = hsl[0]; $("cp-s").value = hsl[1]; $("cp-l").value = hsl[2]; cb(hx); }
  };
  $("cp-t").textContent = title;
  $("cp-h").value = hsl[0]; $("cp-s").value = hsl[1]; $("cp-l").value = hsl[2];
  $("cp-pv").style.background = cur; $("cp-hex").value = cur;
  ["h","s","l"].forEach((k,i)=>$("cp-"+k).oninput = e => { hsl[i] = +e.target.value; upd(); });
  $("cp-hex").oninput = e => { const v = e.target.value.trim(); if(/^#[0-9a-fA-F]{6}$/.test(v)) upd(v.toLowerCase()); };
  $("cp-sw").innerHTML = SWATCH.map(c=>'<button data-c="'+c+'" style="background:'+c+'"></button>').join("");
  $("cp-sw").querySelectorAll("button").forEach(b=>b.onclick=()=>upd(b.dataset.c));
  $("cp-no").onclick = () => { cb(orig); $("cps").style.display = "none"; };
  $("cp-ok").onclick = () => { $("cps").style.display = "none"; };
  $("cps").style.display = "flex";
}

function renderCtList(){
  const l = $("ct-l"); if(!l) return;
  const wantOn = CT.tab === "on", q = CT.q;
  let rows = CT.list.filter(c=>c.on === wantOn && (!q || c.name.toLowerCase().indexOf(q) >= 0 || c.num.indexOf(q) >= 0));
  if(wantOn){
    const inC = new Set(CT.list.map(c=>c.num));
    Object.keys(profiles).filter(n=>n !== me && !inC.has(n)).forEach(n=>{ const nm = dn(n); if(!q || nm.toLowerCase().indexOf(q) >= 0) rows.push({num:n,name:nm,on:true}); });
  }
  if(!rows.length){ l.innerHTML = '<div class="empty">'+(wantOn?"Henüz kimse yok":"Kişi bulunamadı")+'</div>'; return; }
  const part = rows.slice(0,CT.lim);

    if(inv){ ev.stopPropagation(); if(NA) NA.sms(inv.dataset.inv, INVITE_TEXT); else shareInvite(); return; }
    openProfile(e.dataset.n);

  const mo = $("ct-more"); if(mo) mo.onclick = () => { CT.lim += 150; renderCtList(); };
}
function syncContacts(){
  if(!NA) return;
  if(NA.hasContactsPermission()) doSync();

async function doSync(){
  const b = $("ctb"); if(b) b.innerHTML = '<div class="empty">Senkronize ediliyor...</div>';
  await loadProfiles();
  let raw = []; try{ raw = JSON.parse(NA.getContacts()); }catch(e){}
  const seen = new Map();
  raw.forEach(c=>{ const num = normContact(c.p); if(num && num !== me && !seen.has(num)) seen.set(num,(c.n||"").trim()); });
  cmap = {}; seen.forEach((n,num)=>{ if(n) cmap[num] = n; }); SJ("cmap",cmap);
  CT.list = [...seen].map(([num,n])=>({num:num, name:n||fmtPhone(num), on:!!profiles[num]})).sort((a,b)=>a.name.localeCompare(b.name,"tr"));
  CT.loaded = true; CT.tab = "on"; CT.q = "";
  refreshAv(); renderCt(); if(ALL_MSGS.length) rebuildChatView(true);
}

/* ================= DURUM ================= */
const SBG = ["#00a884","#3b82f6","#8b5cf6","#ec4899","#ef4444","#f59e0b","#0b141a"];
let stData = [], stErr = "", stBg = SBG[0], seenMap = J("seen",{});
const stTime = iso => { const d = new Date(iso), n = new Date(), t = d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}); return d.toDateString()===n.toDateString() ? "Bugün "+t : "Dün "+t; };
const stGroups = () => { const g = {}; stData.forEach(s=>(g[s.sender]=g[s.sender]||[]).push(s)); return g; };
async function loadStatuses(){
  const since = new Date(Date.now()-864e5).toISOString();
  const r = await db.from("statuses").select().gt("created_at",since).order("created_at",{ascending:true});
  if(r.error){ stErr = r.error.message; stData = []; } else { stErr = ""; stData = r.data || []; }
  if(isOpen("stp")) renderSt();
}
function renderSt(){
  const g = stGroups(), list = $("stl"), mine = g[me] || [];
  let h = '<div class="sti" id="stmine"><div class="rg none"><div class="a" data-av="'+esc(me)+'"></div><div class="plus">'+ic("plus")+'</div></div>'
    + '<div class="nfo"><b>Durumum</b><small>'+(mine.length ? mine.length+" durum · "+stTime(mine[mine.length-1].created_at) : "Durum eklemek için dokun")+'</small></div></div>';
  if(stErr) h += '<div class="empty">Durumlar yüklenemedi: '+esc(stErr)+'</div>';
  else {
    const others = Object.keys(g).filter(n=>n!==me).sort((a,b)=>g[b][g[b].length-1].id - g[a][g[a].length-1].id);
    h += '<div class="sh">Son güncellemeler</div>';
    if(!others.length) h += '<div class="empty">Henüz kimse durum paylaşmadı.</div>';
    others.forEach(n=>{
      const arr = g[n], last = arr[arr.length-1], seen = (seenMap[n]||0) >= last.id;
      h += '<div class="sti" data-n="'+esc(n)+'"><div class="rg'+(seen?" seen":"")+'"><div class="a" data-av="'+esc(n)+'"></div></div><div class="nfo"><b>'+esc(dn(n))+'</b><small>'+stTime(last.created_at)+'</small></div></div>';
    });
  }

const bc = (ev,p) => { if(ch) ch.send({type:"broadcast",event:ev,payload:p}); };

function startRealtime(){
  if(ch){ try{ db.removeChannel(ch); }catch(e){} ch = null; }
  ch = db.channel("holdingciler_live_v2",{config:{broadcast:{self:false},presence:{key:myId}}});
  ch.on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>ingestIncomingMessage(p.new, true))
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},p=>{ if(p.old && p.old.id) removeMsgLocally(p.old.id); })
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},p=>{ if(p.new && p.new.name){ profiles[p.new.name] = p.new; SJ("pc",profiles); refreshAv(); } })
    .on("postgres_changes",{event:"*",schema:"public",table:"statuses"},()=>{ if(!V) loadStatuses(); })
    .on("presence",{event:"sync"},()=>{ online = Object.keys(ch.presenceState()).length || 1; updSub(); })
    .on("broadcast",{event:"new_msg"},({payload})=>{ if(payload && payload.msg) ingestIncomingMessage(payload.msg, true); })
    .on("broadcast",{event:"msg_delete"},({payload})=>{ if(payload && payload.id) removeMsgLocally(payload.id); })
    .on("broadcast",{event:"msg_clear"},({payload})=>{
      if(payload && payload.room_id && payload.room_id !== ROOM_GENERAL){
        clearedAtMap[payload.room_id] = new Date().toISOString();
        SJ("cleared_at", clearedAtMap);
        if(activeChat === payload.room_id) rebuildChatView(false);
      }
    })
    .on("broadcast",{event:"group_update"},({payload})=>{
      if(payload && payload.group && payload.group.id){
        groups[payload.group.id] = payload.group;
        SJ("groups_cache", groups);
        if(activeChat === payload.group.id) updateHeaderChat();
      }
    })
    .on("broadcast",{event:"typing"},({payload})=>{
      if(!payload || !payload.name) return;
      clearTimeout((typing.get(payload.name)||{}).t);
      typing.set(payload.name,{room:payload.room_id, t:setTimeout(()=>{ typing.delete(payload.name); updSub(); },3000)});
      updSub();
    })
    .on("broadcast",{event:"ring"},({payload})=>incoming(payload))
    .on("broadcast",{event:"sig"},({payload})=>onSig(payload))
    .subscribe(s=>{
      if(s === "SUBSCRIBED" && lb("onl",true)) ch.track({name:me});
    });

  // Uygulama ön plana döndüğünde kaçırılan mesajları anında çek
  document.addEventListener("visibilitychange", ()=>{
    if(!document.hidden){
      fetchLatest();
      if(ch && lb("onl",true)) ch.track({name:me});
    }
  });
}

/* ================= ARAMA (WebRTC, grup) ================= */
const ICE = [{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}];
let call = null;
const sig = (t,o) => bc("sig",Object.assign({t:t,from:myId,name:me},o||{}));
function layout(){ const n = $("grid").children.length; $("grid").className = n<=1 ? "g1" : n===2 ? "g2" : "gN"; }
function addTile(id,name,local){
  const t = el("div","tile"+(local?" loc":"")); t.id = "tl_"+id;
  t.innerHTML = '<div class="a" data-av="'+esc(name)+'"></div><video autoplay playsinline'+(local?" muted":"")+'></video><div class="nm">'+esc(local?"Sen":dn(name))+'</div>';
  $("grid").appendChild(t); refreshAv(t); layout();
  return {t:t, v:t.querySelector("video")};
}
async function joinCall(video){
  if(call) return false;
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true, video: video ? {facingMode:"user"} : false}); }
  catch(e){ alert("Kamera/mikrofon izni verilmedi: " + e.message); return false; }
  call = {video:video, peers:{}, local:stream, cam:video, facing:"user"};
  $("grid").innerHTML = ""; call.lt = addTile(myId,me,true); call.lt.v.srcObject = stream;
  if(video) call.lt.v.classList.add("mir");
  $("bc").style.display = $("bf").style.display = video ? "flex" : "none";
  $("bm").className = ""; $("bc").className = ""; $("bm").innerHTML = ic("mic"); $("bc").innerHTML = ic("video");
  $("call").style.display = "flex"; $("ring").style.display = "none";
  sig("hello"); return true;
}
function mkPeer(id,name){
  const pc = new RTCPeerConnection({iceServers:ICE});
  const p = {pc:pc, name:name, pend:[], tile:addTile(id,name,false)};
  call.peers[id] = p;
  call.local.getTracks().forEach(tr=>pc.addTrack(tr,call.local));
  pc.onicecandidate = e => { if(e.candidate) sig("ice",{to:id,c:e.candidate}); };
  pc.ontrack = e => { p.tile.v.srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => { if(pc.connectionState==="failed" || pc.connectionState==="closed") dropPeer(id,pc); };
  return p;
}
function dropPeer(id,pc){
  if(!call) return;
  const p = call.peers[id]; if(!p || (pc && p.pc!==pc)) return;
  try{ p.pc.close(); }catch(e){}
  p.tile.t.remove(); delete call.peers[id]; layout();
}
async function flush(p){ for(const c of p.pend.splice(0)){ try{ await p.pc.addIceCandidate(c); }catch(e){} } }
async function onSig(m){
  if(!call || m.from===myId) return;
  if(m.to && m.to!==myId) return;
  try{
    if(m.t==="hello"){
      if(call.peers[m.from]) return;
      const p = mkPeer(m.from,m.name);
      await p.pc.setLocalDescription(await p.pc.createOffer());
      sig("offer",{to:m.from,sdp:p.pc.localDescription});
    } else if(m.t==="offer"){
      let p = call.peers[m.from];
      if(p){ if(p.pc.signalingState==="have-local-offer" && myId<m.from) return; dropPeer(m.from); }
      p = mkPeer(m.from,m.name);
      await p.pc.setRemoteDescription(m.sdp); await flush(p);
      await p.pc.setLocalDescription(await p.pc.createAnswer());
      sig("answer",{to:m.from,sdp:p.pc.localDescription});
    } else if(m.t==="answer"){
      const p = call.peers[m.from];
      if(p && p.pc.signalingState==="have-local-offer"){ await p.pc.setRemoteDescription(m.sdp); await flush(p); }
    } else if(m.t==="ice"){
      const p = call.peers[m.from]; if(!p) return;
      if(p.pc.remoteDescription){ try{ await p.pc.addIceCandidate(m.c); }catch(e){} } else p.pend.push(m.c);
    } else if(m.t==="bye") dropPeer(m.from);
  }catch(e){ console.warn("sig hata",e); }
}
function hangup(){
  if(!call) return;
  sig("bye"); Object.keys(call.peers).forEach(id=>dropPeer(id));
  call.local.getTracks().forEach(t=>t.stop()); call = null;
  $("call").style.display = "none"; $("grid").innerHTML = "";
}
async function startCall(video){
  if(call) return;
  if(!(await joinCall(video))) return;
  bc("ring",{name:me,video:video});
  send({}, (video?"Görüntülü":"Sesli")+" arama başlattı, katılmak için üstteki butonlara bas");
}
let ringT, ringVideo = false;
function incoming(p){
  if(call) return;
  ringVideo = !!p.video;
  $("rt").innerHTML = ic(p.video?"video":"phone") + "<span style='display:block'>" + esc(dn(p.name)) + " arıyor</span>";
  $("ring").style.display = "flex";
  if(navigator.vibrate && lb("vib",true)) navigator.vibrate([300,150,300]);
  clearTimeout(ringT); ringT = setTimeout(()=>$("ring").style.display="none",40000);
}
$("rj").onclick = () => { clearTimeout(ringT); joinCall(ringVideo); };
$("rn").onclick = () => { clearTimeout(ringT); $("ring").style.display = "none"; };
$("cv").onclick = () => startCall(false);
$("cw").onclick = () => startCall(true);
$("be").onclick = hangup;
$("bm").onclick = () => {
  if(!call) return; const t = call.local.getAudioTracks()[0]; if(!t) return;
  t.enabled = !t.enabled; $("bm").classList.toggle("off",!t.enabled); $("bm").innerHTML = ic(t.enabled?"mic":"micoff");
};
$("bc").onclick = () => {
  if(!call || !call.video) return; const t = call.local.getVideoTracks()[0]; if(!t) return;
  t.enabled = !t.enabled; call.cam = t.enabled; $("bc").classList.toggle("off",!t.enabled); $("bc").innerHTML = ic(t.enabled?"video":"videooff");
};
$("bf").onclick = async () => {
  if(!call || !call.video) return;
  const old = call.local.getVideoTracks()[0], next = call.facing==="user" ? "environment" : "user";
  try{
    if(old){ old.stop(); call.local.removeTrack(old); }
    const ns = await navigator.mediaDevices.getUserMedia({video:{facingMode:next}});
    const nt = ns.getVideoTracks()[0]; nt.enabled = call.cam;
    Object.values(call.peers).forEach(p=>{ const s = p.pc.getSenders().find(s=>s.track===null || (s.track && s.track.kind==="video")); if(s) s.replaceTrack(nt); });
    call.local.addTrack(nt); call.facing = next; call.lt.v.srcObject = call.local; call.lt.v.classList.toggle("mir",next==="user");
  }catch(e){ alert("Kamera çevrilemedi: " + e.message); }
};
