<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202c33">
<title>Holdingciler</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b141a;color:#e9edef;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{background:#202c33;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
header b{display:block;font-size:17px}
header small{color:#8696a0;font-size:12px}
#msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:3px;background:#0b141a}
.day{align-self:center;background:#182229;color:#8696a0;font-size:12px;padding:4px 10px;border-radius:8px;margin:8px 0}
.m{max-width:80%;padding:6px 9px 4px;border-radius:10px;background:#202c33;align-self:flex-start;word-wrap:break-word}
.m.me{background:#005c4b;align-self:flex-end}
.n{font-size:12px;font-weight:600;margin-bottom:2px}
.m img,.m video{display:block;max-width:100%;max-height:300px;border-radius:8px;margin:3px 0;cursor:pointer}
.t{font-size:10px;color:#8696a0;text-align:right;margin-top:2px}
#up{display:none;background:#182229;color:#00a884;text-align:center;font-size:13px;padding:6px}
footer{display:flex;gap:8px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#202c33;align-items:center}
#t{flex:1;padding:11px 14px;border-radius:22px;border:0;background:#2a3942;color:#fff;font-size:16px;outline:0}
#s,.clip{background:#00a884;border:0;color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.clip{background:transparent;color:#8696a0;font-size:22px}
#v{display:none;position:fixed;inset:0;background:#000e;z-index:9;align-items:center;justify-content:center}
#v img,#v video{max-width:100%;max-height:100%}
#x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:18px;font-size:34px;color:#fff}
</style></head><body>
<header id="h"><div class="av">H</div><div><b>Holdingciler</b><small id="who"></small></div></header>
<div id="msgs"></div>
<div id="up">Yükleniyor...</div>
<footer>
<label class="clip">📎<input id="f" type="file" accept="image/*,video/*" hidden></label>
<input id="t" placeholder="Mesaj yaz" autocomplete="off">
<button id="s">➤</button>
</footer>
<div id="v"><span id="x">✕</span><div id="vb"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient("https://bvhoxwucnanqpactbqhl.supabase.co","sb_publishable_sxomooOMcsrNwiMK8EnsAg_AOtfG79l");
const $ = id => document.getElementById(id);
const box = $("msgs");
let me = localStorage.getItem("ad");
if(!me){ me = (prompt("Adın?")||"Anonim").trim().slice(0,20); localStorage.setItem("ad", me); }
$("who").textContent = "Sen: " + me + " (değiştirmek için dokun)";
$("h").onclick = () => {
  const n = prompt("Yeni adın?", me);
  if(n && n.trim()){ localStorage.setItem("ad", n.trim().slice(0,20)); location.reload(); }
};

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colors = ["#53bdeb","#e7a33e","#ff7eb6","#a78bfa","#34d399","#f87171","#fbbf24"];
const color = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))|0; return colors[Math.abs(h)%colors.length]; };

const shown = new Set();
let lastDay = "";

function show(m){
  if(shown.has(m.id)) return;
  shown.add(m.id);
  const dt = new Date(m.created_at);
  const day = dt.toDateString();
  if(day !== lastDay){
    lastDay = day;
    const s = document.createElement("div");
    s.className = "day";
    s.textContent = dt.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
    box.appendChild(s);
  }
  const mine = m.sender === me;
  const d = document.createElement("div");
  d.className = "m" + (mine ? " me" : "");
  let h = mine ? "" : '<div class="n" style="color:'+color(m.sender)+'">'+esc(m.sender)+'</div>';
  if(m.media_url){
    h += m.media_type === "video"
      ? '<video src="'+esc(m.media_url)+'#t=0.1" playsinline preload="metadata"></video>'
      : '<img src="'+esc(m.media_url)+'" loading="lazy">';
  }
  if(m.body) h += '<div>'+esc(m.body)+'</div>';
  h += '<div class="t">'+dt.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+'</div>';
  d.innerHTML = h;
  const media = d.querySelector("img,video");
  if(media) media.onclick = e => {
    e.preventDefault();
    $("vb").innerHTML = m.media_type === "video"
      ? '<video src="'+esc(m.media_url)+'" controls autoplay playsinline></video>'
      : '<img src="'+esc(m.media_url)+'">';
    $("v").style.display = "flex";
  };
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

$("x").onclick = () => { $("vb").innerHTML = ""; $("v").style.display = "none"; };

async function send(extra){
  extra = extra || {};
  const body = $("t").value.trim();
  if(!body && !extra.media_url) return;
  $("t").value = "";
  const r = await db.from("messages").insert(Object.assign({sender:me, body:body}, extra)).select().single();
  if(r.error){ alert("Gönderilemedi: " + r.error.message); return; }
  show(r.data);
}

$("s").onclick = () => send();
$("t").onkeydown = e => { if(e.key === "Enter") send(); };

$("f").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  if(file.size > 50*1024*1024){ alert("Dosya 50 MB'dan büyük, sıkıştırıp tekrar dene."); return; }
  $("up").style.display = "block";
  const name = Date.now() + "_" + file.name.replace(/[^\w.]/g, "_");
  const r = await db.storage.from("media").upload(name, file);
  $("up").style.display = "none";
  if(r.error){ alert("Yüklenemedi: " + r.error.message); return; }
  const url = db.storage.from("media").getPublicUrl(name).data.publicUrl;
  send({media_url:url, media_type: file.type.startsWith("video") ? "video" : "image"});
};

(async () => {
  const r = await db.from("messages").select().order("created_at").limit(200);
  (r.data || []).forEach(show);
  db.channel("c").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>show(p.new)).subscribe();
})();
</script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
