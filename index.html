<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202c33" id="tc">
<title>Sohbet Odası</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0b141a;--pn:#202c33;--in:#202c33;--out:#005c4b;--tx:#e9edef;--sb:#8696a0;--ac:#00a884;--ip:#2a3942;--bd:#ffffff14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;pointer-events:none}
header{background:var(--pn);padding:8px 8px 8px 4px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;box-shadow:0 1px 0 var(--bd);z-index:2}
header .info{flex:1;min-width:0}
header b{display:block;font-size:19px}
header small{color:var(--sb);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:active{background:var(--bd)}
#msgs{flex:1;overflow-y:auto;padding:8px 10px 12px;display:flex;flex-direction:column;background:var(--bg)}
.day{align-self:center;background:var(--pn);color:var(--sb);font-size:12px;padding:4px 12px;border-radius:10px;margin:12px 0 4px}
.row{display:flex;gap:6px;align-items:flex-end;margin-top:2px}
.row.first{margin-top:10px}
.row.me{justify-content:flex-end}
.a{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;font-size:14px}
.a img{width:100%;height:100%;object-fit:cover;display:block}
.a.sp{visibility:hidden}
.m{max-width:78%;padding:7px 10px 5px;border-radius:16px;background:var(--in);box-shadow:0 1px 1px #0002;overflow-wrap:anywhere;line-height:1.35}
.row.ot.first .m{border-top-left-radius:4px}
.row.me.first .m{border-top-right-radius:4px}
.row.me .m{background:var(--out)}
.m a{color:var(--ac)}
.n{font-size:12.5px;font-weight:600;margin-bottom:2px}
.m img.p,.m video{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:3px 0}
.t{font-size:10.5px;color:var(--sb);text-align:right;margin-top:2px}
#up{display:none;background:var(--pn);color:var(--ac);text-align:center;font-size:13px;padding:6px}
footer{display:flex;gap:8px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--pn);align-items:center}
#t{flex:1;min-width:0;padding:11px 16px;border-radius:24px;border:0;background:var(--ip);color:var(--tx);font-size:16px;outline:0}
#t::placeholder{color:var(--sb)}
#s{background:var(--ac);color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.clip{color:var(--sb);width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
#v{display:none;position:fixed;inset:0;background:#000e;z-index:40;align-items:center;justify-content:center;flex-direction:column;color:#fff}
#v img.big,#v video{max-width:100%;max-height:100%}
#x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:18px;color:#fff;z-index:2;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.pc{text-align:center}.pc .a{width:160px;height:160px;font-size:64px;margin:0 auto 14px}.pc small{color:#cbd5e1}
/* menü */
#mback{display:none;position:fixed;inset:0;z-index:49}
#menu{display:none;position:fixed;top:calc(52px + env(safe-area-inset-top));left:8px;background:var(--pn);border-radius:14px;box-shadow:0 8px 28px #0009;z-index:50;min-width:250px;overflow:hidden}
#menu .mh{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--bd)}
#menu .mh .a{width:44px;height:44px;font-size:18px}
#menu .mh b{display:block;font-size:16px}
#menu .mh small{color:var(--sb);font-size:12px}
#menu button.mi{display:flex;align-items:center;gap:16px;width:100%;padding:14px 16px;font-size:16px;text-align:left}
#menu button.mi:active{background:var(--bd)}
#menu button.mi .i{color:var(--sb)}
/* ayarlar */
#set{display:none;position:fixed;inset:0;background:#000a;z-index:30;align-items:center;justify-content:center;padding:14px}
.card{background:var(--pn);width:100%;max-width:420px;max-height:92dvh;overflow:auto;border-radius:18px;padding:18px}
.card h3{margin:0 0 12px}
.card label.l{display:block;font-size:12px;color:var(--sb);margin:12px 0 4px}
.card input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:0;background:var(--ip);color:var(--tx);font-size:16px;outline:0}
#sa{width:96px;height:96px;font-size:40px;margin:4px auto 0;cursor:pointer;position:relative}
.hint{text-align:center;font-size:12px;color:var(--sb);margin-top:6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:10px;background:var(--ip);font-size:14px}
.seg button.on{background:var(--ac);color:#fff}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--tx)}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{flex:1;padding:12px;border-radius:12px;background:var(--ip);font-weight:600}
.acts button.pri{background:var(--ac);color:#fff}
#setcard[data-m="p"] .sec-s{display:none}
#setcard[data-m="s"] .sec-p{display:none}
/* arama */
#call{display:none;position:fixed;inset:0;background:#0d0d0d;z-index:20;flex-direction:column;color:#fff}
#grid{flex:1;display:grid;gap:4px;padding:4px;padding-top:calc(4px + env(safe-area-inset-top));position:relative;min-height:0}
#grid.g1,#grid.g2{grid-template-columns:1fr}
#grid.gN{grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.tile{position:relative;background:#222;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile video.mir{transform:scaleX(-1)}
.tile .a{width:84px;height:84px;font-size:34px}
.tile .nm{position:absolute;left:8px;bottom:8px;font-size:13px;background:#0009;padding:2px 9px;border-radius:10px;z-index:2}
#grid.g2 .tile.loc{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));width:100px;height:140px;z-index:3;box-shadow:0 2px 10px #000a}
#grid.g2 .tile.loc .a{width:48px;height:48px;font-size:20px}
#grid.g2 .tile.loc .nm{display:none}
#ctl{display:flex;justify-content:center;gap:16px;padding:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#ctl button{width:58px;height:58px;border-radius:50%;background:#ffffff26;display:flex;align-items:center;justify-content:center;color:#fff}
#ctl button.off{background:#fff;color:#000}
#ctl button.red{background:#e53935;color:#fff}
#ctl button.red .i{transform:rotate(135deg)}
#ring{display:none;position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));background:var(--pn);color:var(--tx);z-index:35;border-radius:16px;padding:12px;box-shadow:0 6px 24px #0008;align-items:center;gap:10px}
#ring span{flex:1;font-size:15px;display:flex;align-items:center;gap:8px}
#ring button{padding:10px 16px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600}
#ring button.no{background:var(--ip);color:var(--tx);padding:10px 12px;display:flex}
/* durum sayfası */
#stp{display:none;position:fixed;inset:0;background:var(--bg);z-index:25;flex-direction:column}
#stp header{padding-left:4px}
#stl{flex:1;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sh{font-size:13px;color:var(--sb);padding:14px 16px 6px;font-weight:600}
.sti{display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer}
.sti:active{background:var(--bd)}
.sti .a{width:50px;height:50px;font-size:20px}
.sti .nfo{flex:1;min-width:0}
.sti .nfo b{display:block;font-size:16px}
.sti .nfo small{color:var(--sb);font-size:13px}
.rg{padding:3px;border-radius:50%;border:3px solid var(--ac);flex-shrink:0}
.rg.seen{border-color:var(--sb)}
.rg.none{border-color:transparent;position:relative}
.plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.plus .i{width:14px;height:14px;stroke-width:3}
.empty{color:var(--sb);text-align:center;padding:30px 24px;font-size:14px;line-height:1.5}
#stfab{position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0008}
#ssheet{display:none;position:fixed;inset:0;background:#0008;z-index:48;align-items:flex-end}
#ssheet .box{background:var(--pn);width:100%;border-radius:18px 18px 0 0;padding:10px 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#ssheet button{display:flex;align-items:center;gap:16px;width:100%;padding:16px 22px;font-size:16px;text-align:left}
#ssheet button:active{background:var(--bd)}
#ssheet label{display:flex;align-items:center;gap:16px;width:100%;padding:16px 22px;font-size:16px;cursor:pointer}
/* durum izleyici */
#stv{display:none;position:fixed;inset:0;background:#000;z-index:45;flex-direction:column;color:#fff}
.pbs{display:flex;gap:4px;padding:8px 10px 0;padding-top:calc(8px + env(safe-area-inset-top));z-index:3}
.pb{flex:1;height:3px;background:#ffffff55;border-radius:2px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#fff}
.pb.done i,.pb.curv i{width:100%}
.pb.cur i{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.svh{display:flex;align-items:center;gap:10px;padding:8px 10px;z-index:3}
.svh .a{width:38px;height:38px;font-size:16px}
.svh .nfo{flex:1;min-width:0}
.svh .nfo b{display:block;font-size:15px}
.svh .nfo small{color:#cbd5e1;font-size:12px}
.svh button{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff}
#svb{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#svb img,#svb video{max-width:100%;max-height:100%}
#svb .tx{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:28px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
/* durum yazma */
#stc{display:none;position:fixed;inset:0;z-index:45;flex-direction:column;color:#fff}
#stc .top{display:flex;padding:8px;padding-top:calc(8px + env(safe-area-inset-top))}
#stc .top button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff}
#stct{flex:1;background:none;border:0;outline:0;color:#fff;font-size:28px;font-weight:600;text-align:center;resize:none;padding:20px;display:block;width:100%}
#stct::placeholder{color:#ffffffaa}
#stc .bot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#stc .bot button{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#00000040}
#stc .bot button#stcs{background:#fff;color:#000}
#stcc{border:3px solid #fff!important}

.m{font-size:var(--fs,16px);border-radius:var(--br,16px)}
#vb{max-height:100%;overflow:auto;width:100%;text-align:center}
.pd{background:#ffffff14;border-radius:12px;padding:10px 14px;margin:8px 0;text-align:left;width:100%;max-width:340px}
.pd small{color:#cbd5e1;font-size:12px;display:block}
#sp,#subp{display:none;position:fixed;inset:0;background:var(--bg);flex-direction:column}
#sp{z-index:26}#subp{z-index:27}
.pgb{flex:1;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.hero{display:flex;align-items:center;gap:14px;padding:16px;background:var(--pn);margin-bottom:8px;cursor:pointer}
.hero .a{width:64px;height:64px;font-size:26px}
.hero b{display:block;font-size:19px}.hero small{color:var(--sb)}
.si{display:flex;align-items:center;gap:18px;padding:14px 18px;width:100%;text-align:left}
.si:active{background:var(--bd)}
.si>.i{color:var(--sb)}
.si .tt{flex:1;min-width:0}.si .tt b{display:block;font-weight:500;font-size:16px}.si .tt small{color:var(--sb);font-size:13px}
.si .i:last-child{width:18px;height:18px;opacity:.6}
.sec{font-size:13px;color:var(--ac);font-weight:600;padding:16px 18px 6px}
.fld{padding:6px 18px}
.fld label{display:block;font-size:12px;color:var(--sb);margin:10px 0 4px}
.fld input,.fld textarea{width:100%;padding:11px 12px;border-radius:10px;border:0;background:var(--ip);color:var(--tx);font-size:16px;outline:0;font-family:inherit}
.fld textarea{resize:none;height:80px}
.btn{display:block;margin:14px 18px;padding:13px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;text-align:center;width:calc(100% - 36px)}
.btn.sec2{background:var(--ip);color:var(--tx)}
.btn.dng{background:#e53935;color:#fff}
.tr{display:flex;align-items:center;gap:14px;padding:12px 18px}
.tr .tt{flex:1}.tr .tt b{display:block;font-weight:500}.tr .tt small{color:var(--sb);font-size:13px}
.tg{width:46px;height:26px;border-radius:13px;background:var(--ip);position:relative;flex-shrink:0;transition:.2s;border:1px solid var(--bd)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--sb);transition:.2s}
.tg.on{background:var(--ac)}.tg.on::after{left:22px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px}
.chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:20px;background:var(--ip);font-size:14px}
.chip i{width:14px;height:14px;border-radius:50%;display:block}
.chip.on{outline:2px solid var(--ac)}
.pav{position:relative;width:110px;height:110px;margin:18px auto 6px}
.pav .a{width:110px;height:110px;font-size:44px}
.pav label{position:absolute;right:0;bottom:0;width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);cursor:pointer}
.pav label .i{width:18px;height:18px}
.note{color:var(--sb);font-size:12.5px;padding:6px 18px;line-height:1.5}
.note a{color:var(--ac)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;font-size:15px}.kv span:last-child{color:var(--sb);text-align:right}
</style></head><body>

<script>
const db = supabase.createClient("https://bvhoxwucnanqpactbqhl.supabase.co","sb_publishable_sxomooOMcsrNwiMK8EnsAg_AOtfG79l",{realtime:{params:{eventsPerSecond:40}}});
const $ = id => document.getElementById(id);
const el = (t,c) => { const e = document.createElement(t); if(c) e.className = c; return e; };
const ic = n => '<svg class="i"><use href="#i-'+n+'"/></svg>';
const box = $("msgs");
const myId = Math.random().toString(36).slice(2,10);
const LS = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

let me = LS.get("ad");
if(!me){ me = (prompt("Adın?")||"Anonim").trim().slice(0,20); LS.set("ad", me); }

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const linkify = s => s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const colors = ["#53bdeb","#e7a33e","#ff7eb6","#a78bfa","#34d399","#f87171","#fbbf24"];
const color = n => { let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))|0; return colors[Math.abs(h)%colors.length]; };

/* ---------- TEMA ---------- */
const ACCENTS = ["#00a884","#3b82f6","#8b5cf6","#ec4899","#ef4444","#f59e0b"];
const mix = (h,t,a) => { const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const x=p(h),y=p(t);
  return "#"+x.map((v,i)=>Math.round(v*(1-a)+y[i]*a).toString(16).padStart(2,"0")).join(""); };
function applyTheme(){
  const mode = LS.get("th")||"dark", ac = LS.get("ac")||ACCENTS[0];
  const dark = mode==="dark" || (mode==="auto" && matchMedia("(prefers-color-scheme:dark)").matches);
  const s = document.documentElement.style, set=(k,v)=>s.setProperty(k,v);
  set("--ac",ac);
  if(dark){ set("--bg","#0b141a");set("--pn","#202c33");set("--in","#202c33");set("--tx","#e9edef");set("--sb","#8696a0");set("--ip","#2a3942");set("--bd","#ffffff14");set("--out",mix(ac,"#000000",.5)); }
  else    { set("--bg","#efeae2");set("--pn","#f0f2f5");set("--in","#ffffff");set("--tx","#111b21");set("--sb","#667781");set("--ip","#ffffff");set("--bd","#00000014");set("--out",mix(ac,"#ffffff",.78)); }
  $("tc").setAttribute("content", dark ? "#202c33" : "#f0f2f5");
  document.querySelectorAll('[data-sg="th"] button').forEach(b=>b.classList.toggle("on",b.dataset.v===mode));
  document.querySelectorAll(".sw button").forEach(b=>b.classList.toggle("on",b.dataset.c===ac));
  applyPers();
}
applyTheme();

/* ---------- PROFİLLER ---------- */
let profiles = {};
const avUrl = n => { const p = profiles[n]; if(!p || !p.avatar_url) return ""; if(n !== me && ((getExtra(n).priv||{}).photo) === "none") return ""; return p.avatar_url; };
const avHTML = n => { const u = avUrl(n); return u ? '<img src="'+esc(u)+'" alt="">' : esc((n||"?").trim().charAt(0).toUpperCase()); };
function refreshAv(root){
  (root||document).querySelectorAll("[data-av]").forEach(e=>{
    const n = e.dataset.av;
    e.innerHTML = avHTML(n);
    e.style.background = avUrl(n) ? "transparent" : color(n);
  });
}
async function loadProfiles(){
  const r = await db.from("profiles").select();
  if(r.error){ console.warn("profiles tablosu yok:", r.error.message); return; }
  (r.data||[]).forEach(p=>profiles[p.name]=p);
  refreshAv();
}
function openProfile(n){
  const p = profiles[n]||{}, ex = getExtra(n);
  const row = (l,v) => v ? '<div class="pd"><small>'+l+'</small><div>'+esc(v)+'</div></div>' : "";
  let h = '<div class="pc"><div class="a" data-av="'+esc(n)+'"></div><b style="font-size:22px">'+esc(n)+'</b>';
  if(visible(n,"about")) h += '<br><small>'+esc(p.status||"")+'</small>';
  h += '</div>';
  if(visible(n,"about")) h += row("Biyografi",ex.bio);
  if(visible(n,"details")){
    let bd = ""; if(ex.birthday){ const d = new Date(ex.birthday); if(!isNaN(d)) bd = d.toLocaleDateString("tr-TR",{day:"numeric",month:"long"}); }
    h += row("Meslek",ex.job)+row("Şehir",ex.city)+row("Doğum günü",bd)+row("Telefon",ex.phone)+row("E-posta",ex.email);
  }
  $("vb").innerHTML = '<div style="padding:70px 16px 24px;display:flex;flex-direction:column;align-items:center">'+h+'</div>';
  refreshAv($("vb")); $("v").style.display="flex";
}

/* ---------- MENÜ ---------- */
function menuShow(v){
  $("menu").style.display = v ? "block" : "none";
  $("mback").style.display = v ? "block" : "none";
  if(v){ $("mav").dataset.av = me; $("mnm").textContent = me; $("mst").textContent = (profiles[me]||{}).status || "Müsaitim"; refreshAv($("menu")); }
}
$("mb").onclick = () => menuShow($("menu").style.display !== "block");

/* ---------- MESAJLAR ---------- */
const shown = new Set(); const knownNames = new Set();
let lastDay = "", lastSender = "";
function show(m){
  if(shown.has(m.id)) return;
  shown.add(m.id); knownNames.add(m.sender);
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  const dt = new Date(m.created_at), day = dt.toDateString();
  if(day !== lastDay){
    lastDay = day; lastSender = "";
    const s = el("div","day");
    s.textContent = dt.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
    box.appendChild(s);
  }
  const mine = m.sender === me;
  const first = m.sender !== lastSender; lastSender = m.sender;
  const row = el("div","row "+(mine?"me":"ot")+(first?" first":""));
  if(!mine){
    const a = el("div","a"+(first?"":" sp")); if(first){ a.dataset.av = m.sender; a.onclick=()=>openProfile(m.sender); }
    row.appendChild(a);
  }
  const b = el("div","m");
  let h = (!mine && first) ? '<div class="n" style="color:'+color(m.sender)+'">'+esc(m.sender)+'</div>' : "";
  if(m.media_url){
    h += m.media_type === "video"
      ? '<video src="'+esc(m.media_url)+'#t=0.1" playsinline preload="'+(lb("dsave",false)?"none":"metadata")+'"></video>'
      : '<img class="p" src="'+esc(m.media_url)+'" loading="lazy">';
  }
  if(m.body) h += '<div>'+linkify(esc(m.body))+'</div>';
  h += '<div class="t">'+dt.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+'</div>';
  b.innerHTML = h;
  const media = b.querySelector("img.p,video");
  if(media) media.onclick = e => {
    e.preventDefault();
    $("vb").innerHTML = m.media_type === "video"
      ? '<video src="'+esc(m.media_url)+'" controls autoplay playsinline></video>'
      : '<img class="big" src="'+esc(m.media_url)+'">';
    $("v").style.display = "flex";
  };
  row.appendChild(b); box.appendChild(row);
  refreshAv(row);
  if(near || mine) box.scrollTop = box.scrollHeight;
}
$("x").onclick = () => { $("vb").innerHTML = ""; $("v").style.display = "none"; };

async function send(extra,text){
  extra = extra || {};
  const body = text !== undefined ? text : $("t").value.trim();
  if(!body && !extra.media_url) return;
  if(text === undefined) $("t").value = "";
  const r = await db.from("messages").insert(Object.assign({sender:me, body:body}, extra)).select().single();
  if(r.error){ alert("Gönderilemedi: " + r.error.message); return; }
  show(r.data);
}
$("s").onclick = () => send();
$("t").onkeydown = e => { if(e.key === "Enter" && lb("ent",true)) send(); };
let lastTyp = 0;
$("t").oninput = () => { const n=Date.now(); if(n-lastTyp>2000 && lb("typ",true)){ lastTyp=n; ch.send({type:"broadcast",event:"typing",payload:{name:me}}); } };

async function uploadFile(file){
  const name = Date.now() + "_" + file.name.replace(/[^\w.]/g, "_");
  const r = await db.storage.from("media").upload(name, file);
  if(r.error){ alert("Yüklenemedi: " + r.error.message); return null; }
  return db.storage.from("media").getPublicUrl(name).data.publicUrl;
}
$("f").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  if(file.size > 50*1024*1024){ alert("Dosya 50 MB'dan büyük, sıkıştırıp tekrar dene."); return; }
  $("up").style.display = "block";
  const url = await uploadFile(file);
  $("up").style.display = "none";
  if(!url) return;
  send({media_url:url, media_type: file.type.startsWith("video") ? "video" : "image"});
};

/* ---------- AYARLAR SAYFALARI ---------- */
const APP_VER = "1.1", BUILD = "__BUILD__", REPO = "burakkayaa202-cpu/Holdingciler";
const lb = (k,d) => { const v = LS.get(k); return v === null ? d : v === "1"; };
const kv = (a,b) => '<div class="kv"><span>'+a+'</span><span>'+esc(b)+'</span></div>';
const PRESETS = [["Klasik","#00a884","dark"],["Okyanus","#3b82f6","dark"],["Gece Moru","#8b5cf6","dark"],["Gül","#ec4899","light"],["Gün Batımı","#f59e0b","dark"],["Holding Altın","#e3b341","light"]];

function applyPers(){
  const r = document.documentElement.style;
  r.setProperty("--fs", ({s:14,m:16,l:18}[LS.get("fs")||"m"]||16)+"px");
  r.setProperty("--br", (LS.get("br")||"16")+"px");
  const bg = r.getPropertyValue("--bg").trim(), ac = r.getPropertyValue("--ac").trim(), wp = LS.get("wp")||"none";
  let v = "";
  if(/^#[0-9a-f]{6}$/i.test(bg) && /^#[0-9a-f]{6}$/i.test(ac)){
    if(wp === "tint") v = mix(bg,ac,.10);
    else if(wp === "grad") v = "linear-gradient(160deg,"+bg+","+mix(bg,ac,.25)+")";
    else if(wp === "dots") v = "radial-gradient("+mix(bg,ac,.16)+" 1.5px,transparent 1.5px) 0 0/22px 22px,"+bg;
  }
  ["msgs","prv"].forEach(id=>{ const e = $(id); if(e) e.style.background = v; });
}

/* profil ek bilgileri (profiles.extra) */
function getExtra(n){
  const p = profiles[n];
  if(p && p.extra && typeof p.extra === "object" && Object.keys(p.extra).length) return p.extra;
  if(n === me){ try{ return JSON.parse(LS.get("extra")||"{}"); }catch(e){} }
  return {};
}
function visible(n,k){ if(n === me) return true; return ((getExtra(n).priv||{})[k]) !== "none"; }

async function saveProfile(over){
  over = over || {};
  const cur = profiles[me] || {};
  const extra = Object.assign({}, getExtra(me), over.extra || {});
  if(over.priv) extra.priv = Object.assign({}, extra.priv||{}, over.priv);
  const prof = {
    name: me,
    avatar_url: over.avatar_url !== undefined ? over.avatar_url : (cur.avatar_url||null),
    status: over.status !== undefined ? over.status : (cur.status||""),
    extra: extra
  };
  LS.set("extra", JSON.stringify(extra));
  let warn = false;
  let r = await db.from("profiles").upsert(prof);
  if(r.error){
    r = await db.from("profiles").upsert({name:prof.name, avatar_url:prof.avatar_url, status:prof.status});
    warn = true;
  }
  if(r.error) return {ok:false, msg:r.error.message};
  profiles[me] = prof; refreshAv();
  return {ok:true, warn:warn};
}

function bindCtl(root,onSeg,onTg){
  root.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{
    const k = b.dataset.tg, nv = !lb(k, b.dataset.d === "1");
    LS.set(k, nv ? "1" : "0"); b.classList.toggle("on", nv);
    if(onTg) onTg(k,nv);

  root.querySelectorAll("[data-sg]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{

    g.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x === b));
    if(k.indexOf("pv_") !== 0) LS.set(k, b.dataset.v);

/* ---- profil ---- */
let pendAv = null;
function squareBlob(file,max){
  return new Promise(res=>{
    const i = new Image(), u = URL.createObjectURL(file);
    i.onload = () => {
      const s = Math.min(i.width,i.height), c = document.createElement("canvas");
      c.width = c.height = Math.min(max,s);
      c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b=>res(b),"image/jpeg",.85);
    };
    i.src = u;
  });
}
function pageProfile(){
  const p = profiles[me] || {}, ex = getExtra(me);
  const f = (id,label,val,type,ph) => '<label>'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+esc(val||"")+'"'+(ph?' placeholder="'+ph+'"':'')+' maxlength="60">';
  pendAv = null;
  openSub("Profil",
    '<div class="pav"><div class="a" id="pa" data-av="'+esc(me)+'"></div><label>'+ic("camera")+'<input id="pf-f" type="file" accept="image/*" hidden></label></div>'
    + '<div class="note" style="text-align:center">Fotoğrafı değiştirmek için kameraya dokun</div>'
    + '<div class="fld">'
    + f("pf-n","Ad",me)
    + f("pf-s","Hakkında",p.status,"text","Müsaitim")
    + '<label>Biyografi</label><textarea id="pf-b" maxlength="200" placeholder="Kendinden bahset...">'+esc(ex.bio||"")+'</textarea>'
    + f("pf-j","Meslek / Unvan",ex.job)
    + f("pf-c","Şehir",ex.city)
    + f("pf-d","Doğum günü",ex.birthday,"date")
    + f("pf-p","Telefon",ex.phone,"tel")
    + f("pf-e","E-posta",ex.email,"email")
    + '</div>'
    + '<div class="note">Telefon, e-posta, doğum günü, şehir ve meslek bilgilerini kimlerin görebileceğini Gizlilik bölümünden ayarlarsın.</div>'
    + '<button class="btn" id="pf-save">Kaydet</button>',
    root => {
      $("pf-f").onchange = async e => {
        const f0 = e.target.files[0]; e.target.value = "";
        if(!f0) return;
        pendAv = await squareBlob(f0,256);
        $("pa").style.background = "transparent";
        $("pa").innerHTML = '<img src="'+URL.createObjectURL(pendAv)+'">';
      };
      $("pf-save").onclick = async () => {
        const btn = $("pf-save"); btn.disabled = true; btn.textContent = "...";
        const nn = ($("pf-n").value.trim().slice(0,20)) || me;
        let url = (profiles[me]||{}).avatar_url || null;
        if(pendAv){
          const nm = "avatar_" + Date.now() + ".jpg";
          const r = await db.storage.from("media").upload(nm, pendAv, {contentType:"image/jpeg"});
          if(r.error) alert("Resim yüklenemedi: " + r.error.message);
          else url = db.storage.from("media").getPublicUrl(nm).data.publicUrl;
        }
        me = nn; LS.set("ad", me);
        const r2 = await saveProfile({
          avatar_url: url,
          status: $("pf-s").value.trim().slice(0,60),
          extra: {bio:$("pf-b").value.trim(), job:$("pf-j").value.trim(), city:$("pf-c").value.trim(), birthday:$("pf-d").value, phone:$("pf-p").value.trim(), email:$("pf-e").value.trim()}
        });
        btn.disabled = false; btn.textContent = "Kaydet";
        if(!r2.ok){ alert("Profil kaydedilemedi: " + r2.msg); return; }
        if(r2.warn) alert("Kaydedildi, ama ek bilgiler (şehir, telefon vb.) şimdilik sadece bu telefonda duruyor. Diğerlerinde görünmesi için Supabase'de profiles tablosuna extra sütunu eklemen gerekiyor.");
        if(ch && lb("onl",true)) ch.track({name:me});
        closeSub();
        if($("sp").style.display === "flex") openSettingsPage();
      };
    });
}

async function pageDepolama(){
  let used = 0;
  try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); used += (k.length + (localStorage.getItem(k)||"").length) * 2; } }catch(e){}
  let est = null; try{ est = await navigator.storage.estimate(); }catch(e){}
  const fmt = b => b < 1024 ? b+" B" : b < 1048576 ? (b/1024).toFixed(1)+" KB" : (b/1048576).toFixed(1)+" MB";
  openSub("Depolama ve veri",
    '<div class="sec">Bu telefonda</div>'
    + kv("Ayarlar ve kayıtlı veri", fmt(used))
    + (est ? kv("Uygulama depolaması", fmt(est.usage||0)) : "")

    + '<button class="btn dng" id="dp-rs">Tüm yerel verileri sıfırla</button>'
    + '<div class="note">Mesajlar ve medya sunucuda durur. Bu işlemler sadece bu telefondaki kayıtları temizler. Sıfırlayınca adın tekrar sorulur.</div>',
    root => {
      bindCtl(root);
      $("dp-cl").onclick = async () => {
        try{ const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){}
        seenMap = {}; LS.set("seen","{}");

/* ---------- DURUM ---------- */
const SBG = ["#00a884","#3b82f6","#8b5cf6","#ec4899","#ef4444","#f59e0b","#0b141a"];
let stData = [], stErr = "", stBg = SBG[0];
let seenMap = {}; try{ seenMap = JSON.parse(LS.get("seen")||"{}"); }catch(e){}
const stTime = iso => { const d=new Date(iso), n=new Date(), t=d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}); return d.toDateString()===n.toDateString() ? "Bugün "+t : "Dün "+t; };
const stGroups = () => { const g={}; stData.forEach(s=>(g[s.sender]=g[s.sender]||[]).push(s)); return g; };

async function loadStatuses(){
  const since = new Date(Date.now()-864e5).toISOString();
  const r = await db.from("statuses").select().gt("created_at",since).order("created_at",{ascending:true});
  if(r.error){ stErr = r.error.message; stData = []; } else { stErr = ""; stData = r.data || []; }
  renderSt();
}
function renderSt(){
  const g = stGroups(), list = $("stl");
  const mine = g[me] || [];
  let h = '<div class="sti" id="stmine"><div class="rg none"><div class="a" data-av="'+esc(me)+'"></div><div class="plus">'+ic("plus")+'</div></div>'
    + '<div class="nfo"><b>Durumum</b><small>'+(mine.length ? mine.length+" durum · "+stTime(mine[mine.length-1].created_at) : "Durum eklemek için dokun")+'</small></div></div>';
  if(stErr){
    h += '<div class="empty">Durumlar yüklenemedi.<br>Supabase\'de <b>statuses</b> tablosunu oluşturman gerekiyor.<br><small>'+esc(stErr)+'</small></div>';
  } else {
    const others = Object.keys(g).filter(n=>n!==me).sort((a,b)=>g[b][g[b].length-1].id - g[a][g[a].length-1].id);
    h += '<div class="sh">Son güncellemeler</div>';
    if(!others.length) h += '<div class="empty">Henüz kimse durum paylaşmadı.</div>';
    others.forEach(n=>{
      const arr = g[n], last = arr[arr.length-1];
      const seen = (seenMap[n]||0) >= last.id;
      h += '<div class="sti" data-n="'+esc(n)+'"><div class="rg'+(seen?" seen":"")+'"><div class="a" data-av="'+esc(n)+'"></div></div>'
        + '<div class="nfo"><b>'+esc(n)+'</b><small>'+stTime(last.created_at)+'</small></div></div>';
    });
  }
  list.innerHTML = h;
  refreshAv(list);
  $("stmine").onclick = () => { if(mine.length) openViewer(me); else $("ssheet").style.display = "flex"; };
  list.querySelectorAll(".sti[data-n]").forEach(e=>e.onclick=()=>openViewer(e.dataset.n));
}

/* durum izleyici */
let V = null;
function openViewer(name){
  const items = stGroups()[name] || [];
  if(!items.length) return;
  V = {items:items, i:0, name:name, t:null};
  $("stv").style.display = "flex";
  showItem();
}
function closeViewer(){
  if(V){ clearTimeout(V.t); V = null; }
  $("svb").innerHTML = ""; $("stv").style.display = "none"; renderSt();
}
function nextItem(){ if(!V) return; if(V.i < V.items.length-1){ V.i++; showItem(); } else closeViewer(); }
function prevItem(){ if(!V) return; if(V.i > 0) V.i--; showItem(); }
function showItem(){
  clearTimeout(V.t);
  const it = V.items[V.i], isVid = it.media_type === "video";
  $("pbs").innerHTML = V.items.map((_,k)=>'<div class="pb '+(k<V.i?"done":k===V.i?(isVid?"curv":"cur"):"")+'"><i></i></div>').join("");
  $("svav").dataset.av = V.name; refreshAv($("stv"));
  $("svn").textContent = V.name === me ? "Durumum" : V.name;
  $("svt").textContent = stTime(it.created_at);
  $("svd").style.display = V.name === me ? "flex" : "none";
  const b = $("svb");
  if(it.media_url){
    b.innerHTML = isVid
      ? '<video src="'+esc(it.media_url)+'" autoplay playsinline></video>'
      : '<img src="'+esc(it.media_url)+'">';
    if(isVid) b.querySelector("video").onended = nextItem;
  } else {
    b.innerHTML = '<div class="tx" style="background:'+esc(it.bg||"#00a884")+'">'+esc(it.body||"")+'</div>';
  }
  if(!isVid) V.t = setTimeout(nextItem, 5000);
  if(V.name !== me){ seenMap[V.name] = Math.max(seenMap[V.name]||0, it.id); LS.set("seen", JSON.stringify(seenMap)); }
}
$("svb").onclick = e => { const x = e.clientX / innerWidth; x < .33 ? prevItem() : nextItem(); };
$("svx").onclick = closeViewer;
$("svd").onclick = async () => {
  if(!V || !confirm("Bu durum silinsin mi?")) return;
  const it = V.items[V.i];
  const r = await db.from("statuses").delete().eq("id", it.id);
  if(r.error){ alert("Silinemedi: " + r.error.message); return; }
  stData = stData.filter(s=>s.id!==it.id);
  V.items.splice(V.i,1);
  if(!V.items.length) closeViewer();
  else { if(V.i >= V.items.length) V.i = V.items.length-1; showItem(); }
};

/* ---------- ODA (yazıyor, çevrimiçi, arama sinyali) ---------- */
let online = 1; const typing = new Map();
function updSub(){
  const names = [...typing.keys()];
  $("sub").textContent = names.length ? names.join(", ") + " yazıyor..." : online + " kişi çevrimiçi";
}
const ch = db.channel("room",{config:{broadcast:{self:false},presence:{key:myId}}});
ch.on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>show(p.new))
  .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},p=>{ if(p.new&&p.new.name){ profiles[p.new.name]=p.new; refreshAv(); } })
  .on("postgres_changes",{event:"*",schema:"public",table:"statuses"},()=>{ if(!V) loadStatuses(); })
  .on("presence",{event:"sync"},()=>{ online = Object.keys(ch.presenceState()).length||1; updSub(); })
  .on("broadcast",{event:"typing"},({payload})=>{
    clearTimeout((typing.get(payload.name)||{}).t);
    typing.set(payload.name,{t:setTimeout(()=>{typing.delete(payload.name);updSub();},3000)}); updSub();
  })
  .on("broadcast",{event:"ring"},({payload})=>incoming(payload))
  .on("broadcast",{event:"sig"},({payload})=>onSig(payload))
  .subscribe(s=>{ if(s==="SUBSCRIBED" && lb("onl",true)) ch.track({name:me}); });

const sig = (t,o) => ch.send({type:"broadcast",event:"sig",payload:Object.assign({t:t,from:myId,name:me},o||{})});

function layout(){
  const n = $("grid").children.length;
  $("grid").className = n<=1 ? "g1" : n===2 ? "g2" : "gN";
}
function addTile(id,name,local){
  const t = el("div","tile"+(local?" loc":"")); t.id = "tl_"+id;
  t.innerHTML = '<div class="a" data-av="'+esc(name)+'"></div><video autoplay playsinline'+(local?" muted":"")+'></video><div class="nm">'+esc(local?"Sen":name)+'</div>';
  $("grid").appendChild(t); refreshAv(t); layout();
  return {t:t, v:t.querySelector("video")};
}
async function joinCall(video){
  if(call) return false;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true, video: video ? {facingMode:"user"} : false});
  }catch(e){ alert("Kamera/mikrofon izni verilmedi: " + e.message + "\nTelefon ayarlarından uygulamaya izin ver."); return false; }
  call = {video:video, peers:{}, local:stream, cam:video, facing:"user"};
  $("grid").innerHTML = "";
  call.lt = addTile(myId,me,true);
  call.lt.v.srcObject = stream;
  if(video) call.lt.v.classList.add("mir");
  $("bc").style.display = $("bf").style.display = video ? "flex" : "none";
  $("bm").className = ""; $("bc").className = "";
  $("bm").innerHTML = ic("mic"); $("bc").innerHTML = ic("video");
  $("call").style.display = "flex"; $("ring").style.display = "none";
  sig("hello");
  return true;
}
function mkPeer(id,name){
  const pc = new RTCPeerConnection({iceServers:ICE});
  const p = {pc:pc, name:name, pend:[], tile:addTile(id,name,false)};
  call.peers[id] = p;
  call.local.getTracks().forEach(tr=>pc.addTrack(tr,call.local));
  pc.onicecandidate = e => { if(e.candidate) sig("ice",{to:id,c:e.candidate}); };
  pc.ontrack = e => { p.tile.v.srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => { if(pc.connectionState==="failed" || pc.connectionState==="closed") dropPeer(id,pc); };
  return p;
}
function dropPeer(id,pc){
  if(!call) return;
  const p = call.peers[id];
  if(!p || (pc && p.pc!==pc)) return;
  try{ p.pc.close(); }catch(e){}
  p.tile.t.remove(); delete call.peers[id]; layout();
}
async function flush(p){ for(const c of p.pend.splice(0)){ try{ await p.pc.addIceCandidate(c); }catch(e){} } }
async function onSig(m){
  if(!call || m.from===myId) return;
  if(m.to && m.to!==myId) return;
  try{
    if(m.t==="hello"){
      if(call.peers[m.from]) return;
      const p = mkPeer(m.from,m.name);
      await p.pc.setLocalDescription(await p.pc.createOffer());
      sig("offer",{to:m.from,sdp:p.pc.localDescription});
    } else if(m.t==="offer"){
      let p = call.peers[m.from];
      if(p){
        if(p.pc.signalingState==="have-local-offer" && myId<m.from) return; // ben kazandım, onun teklifini yoksay
        dropPeer(m.from);
      }
      p = mkPeer(m.from,m.name);
      await p.pc.setRemoteDescription(m.sdp);
      await flush(p);
      await p.pc.setLocalDescription(await p.pc.createAnswer());
      sig("answer",{to:m.from,sdp:p.pc.localDescription});
    } else if(m.t==="answer"){
      const p = call.peers[m.from];
      if(p && p.pc.signalingState==="have-local-offer"){ await p.pc.setRemoteDescription(m.sdp); await flush(p); }
    } else if(m.t==="ice"){
      const p = call.peers[m.from]; if(!p) return;
      if(p.pc.remoteDescription){ try{ await p.pc.addIceCandidate(m.c); }catch(e){} } else p.pend.push(m.c);
    } else if(m.t==="bye"){
      dropPeer(m.from);
    }
  }catch(e){ console.warn("sig hata", e); }
}
function hangup(){
  if(!call) return;
  sig("bye");
  Object.keys(call.peers).forEach(id=>dropPeer(id));
  call.local.getTracks().forEach(t=>t.stop());
  call = null;
  $("call").style.display = "none"; $("grid").innerHTML = "";
}
async function startCall(video){
  if(call) return;
  if(!(await joinCall(video))) return;
  ch.send({type:"broadcast",event:"ring",payload:{name:me,video:video}});
  send({}, (video?"Görüntülü":"Sesli")+" arama başlattı, katılmak için üstteki butonlara bas");
}
let ringT, ringVideo = false;
function incoming(p){
  if(call) return;
  ringVideo = !!p.video;
  $("rt").innerHTML = ic(p.video?"video":"phone") + "<span style='display:block'>" + esc(p.name) + " arıyor</span>";
  $("ring").style.display = "flex";
  if(navigator.vibrate && lb("vib",true)) navigator.vibrate([300,150,300]);
  clearTimeout(ringT); ringT = setTimeout(()=>$("ring").style.display="none", 40000);
}
$("rj").onclick = () => { clearTimeout(ringT); joinCall(ringVideo); };
$("rn").onclick = () => { clearTimeout(ringT); $("ring").style.display = "none"; };
$("cv").onclick = () => startCall(false);
$("cw").onclick = () => startCall(true);
$("be").onclick = hangup;
$("bm").onclick = () => {
  if(!call) return;
  const t = call.local.getAudioTracks()[0]; if(!t) return;
  t.enabled = !t.enabled; $("bm").classList.toggle("off",!t.enabled); $("bm").innerHTML = ic(t.enabled ? "mic" : "micoff");
};
$("bc").onclick = () => {
  if(!call || !call.video) return;
  const t = call.local.getVideoTracks()[0]; if(!t) return;
  t.enabled = !t.enabled; call.cam = t.enabled; $("bc").classList.toggle("off",!t.enabled);
  $("bc").innerHTML = ic(t.enabled ? "video" : "videooff");
};
$("bf").onclick = async () => {
  if(!call || !call.video) return;
  const old = call.local.getVideoTracks()[0];
  const next = call.facing==="user" ? "environment" : "user";
  try{
    if(old){ old.stop(); call.local.removeTrack(old); }
    const ns = await navigator.mediaDevices.getUserMedia({video:{facingMode:next}});
    const nt = ns.getVideoTracks()[0]; nt.enabled = call.cam;
    Object.values(call.peers).forEach(p=>{ const s = p.pc.getSenders().find(s=>s.track===null || (s.track && s.track.kind==="video")); if(s) s.replaceTrack(nt); });
    call.local.addTrack(nt); call.facing = next;
    call.lt.v.srcObject = call.local;
    call.lt.v.classList.toggle("mir", next==="user");
  }catch(e){ alert("Kamera çevrilemedi: " + e.message); }
};
